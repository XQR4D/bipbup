    <style>
      :root {
        --accent: #000000;
        --bg: #ededed;
        --card-bg: rgba(0, 0, 0, 0.03);
        --border: rgba(0, 0, 0, 0.08);
        --text: #000000;
        --text-secondary: rgba(0, 0, 0, 0.75);
        --glass: rgba(255, 255, 255, 0.95);
      }

      [data-theme='dark'] {
        --accent: #00ff88;
        --bg: #0a0a0a;
        --card-bg: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.12);
        --text: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.75);
        --glass: rgba(15, 15, 15, 0.95);
      }

      [data-theme='light'] .nav-link:hover,
      [data-theme='light'] .nav-link.active {
        color: var(--accent);
      }

      [data-theme='light'] .nav-link.btn-login {
        border: 1px solid rgba(0, 0, 0, 0.15);
        color: var(--text);
      }

      [data-theme='light'] .nav-link.btn-login:hover {
        background: rgba(0, 0, 0, 0.05);
        color: var(--accent);
      }

      [data-theme='light'] .glass-card {
        background: rgba(31, 30, 30, 0.062) !important;
        color: #000 !important;
      }

      [data-theme='dark'] .nav-link.btn-login {
        border-color: rgba(255, 255, 255, 0.2);
        color: #ffffff;
      }

      [data-theme='dark'] .nav-link.btn-login:hover {
        background: rgba(0, 255, 136, 0.1);
        border-color: var(--accent);
      }

      [data-theme='dark'] .glass-card.group:hover {
        border-color: var(--accent);
      }

      [data-theme='dark'] .glass-card.group:hover .text-\[9px\] {
        color: var(--accent) !important;
      }

      [data-theme='dark'] button.btn-primary {
        background: rgb(0, 255, 136);
        color: #000000;
        border: 1px solid rgba(0, 255, 136, 0.3);
      }

      [data-theme='dark'] .glass-card:hover {
        border-color: var(--accent);
      }

      [data-theme='dark'] a.bg-black\/5,
      [data-theme='dark'] a.border-black\/10 {
        background: rgba(255, 255, 255, 0.08) !important;
        border-color: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
      }

      [data-theme='dark'] .text-\[\#000000\] {
        color: #ffffff !important;
      }

      [data-theme='dark'] .btn-primary {
        background: rgb(0, 255, 136);
        color: #000000;
        border: none;
      }

      [data-theme='dark'] input {
        background: rgba(255, 255, 255, 0.06) !important;
        border-color: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
      }

      [data-theme='dark'] input:focus {
        border-color: var(--accent) !important;
        background: rgba(0, 255, 136, 0.08) !important;
      }

      [data-theme='dark'] textarea {
        background: rgba(255, 255, 255, 0.06) !important;
        border-color: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
      }

      [data-theme='dark'] textarea:focus {
        border-color: var(--accent) !important;
        background: rgba(0, 255, 136, 0.08) !important;
      }

      [data-theme='dark'] .glass-card {
        background: rgba(255, 255, 255, 0.04);
      }

      [data-theme='dark'] .text-\[\#000000\] {
        color: #ffffff !important;
      }

      [data-theme='dark'] .text-\[\#000000\].text-lg,
      [data-theme='dark'] .text-\[\#000000\].text-xl,
      [data-theme='dark'] .text-\[\#000000\].md\:text-xl {
        color: #ffffff !important;
      }

      [data-theme='dark'] .glass-card p.text-\[\#000000\],
      [data-theme='dark'] .glass-card div.text-\[\#000000\] {
        color: #ffffff !important;
      }

      [data-theme='light'] .cookie-btn.accept {
        background: #0d0d0d;
        color: #ffffff;
        border: 1px solid #0d0d0d;
      }

      [data-theme='light'] .cookie-btn.reject,
      [data-theme='light'] .cookie-btn.settings {
        background: rgba(0, 0, 0, 0.05);
        color: #ffffff;
        border: 1px solid rgba(0, 0, 0, 0.15);
      }

      [data-theme='light'] .cookiez {
        color: #ffffff;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Unbounded', sans-serif;
        overflow-x: hidden;
        margin: 0;
        transition: background-color 0.45s cubic-bezier(0.23, 1, 0.32, 1);
      }

      #background-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .glass-card:hover {
        border-color: var(--accent);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      [data-theme='dark'] .glass-card:hover {
        background: rgba(0, 255, 136, 0.12);
      }

      .accent-text {
        color: var(--accent);
        text-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      }

      .nav-link {
        position: relative;
        padding: 8px 0;
        cursor: pointer;
        color: var(--text);
      }

      .nav-link.btn-login {
        border: 1px solid rgba(0, 0, 0, 0.1);
        padding: 8px 20px;
        border-radius: 9999px;
      }

      @keyframes flipOut {
        0% {
          opacity: 1;
          transform: translateY(0) skewY(0deg) scale(1);
          filter: blur(0px);
        }
        60% {
          opacity: 0.3;
          filter: blur(2px);
        }
        100% {
          opacity: 0;
          transform: translateY(-52px) skewY(-5deg) scale(0.96);
          filter: blur(4px);
        }
      }
      @keyframes flipIn {
        0% {
          opacity: 0;
          transform: translateY(52px) skewY(5deg) scale(0.96);
          filter: blur(4px);
        }
        60% {
          opacity: 0.85;
          filter: blur(1px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) skewY(0deg) scale(1);
          filter: blur(0px);
        }
      }
      .hero-text-flip {
        display: inline-block;
        animation: flipIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity, filter;
      }
      .hero-text-flip.out {
        animation: flipOut 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
      }

      @keyframes heroSectionIn {
        0% {
          opacity: 0;
          transform: translateY(28px) scale(0.985);
          filter: blur(6px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0px);
        }
      }
      .hero-section-animate {
        animation: heroSectionIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .hero-btn-animate {
        animation: heroSectionIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
      }
      .hero-disclaimer-animate {
        animation: heroSectionIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
      }
      .home-cards-animate {
        animation: heroSectionIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both;
      }

      .btn-primary {
        background: rgb(0, 0, 0);
        color: #ffffff;
        font-weight: 700;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .btn-primary:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      }

      .pamyatka-img-container {
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 12px;
      }

      .pamyatka-img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      input {
        background: var(--card-bg) !important;
        border: 1px solid var(--border) !important;
        color: var(--text) !important;
        padding: 0 24px !important;
        border-radius: 16px !important;
        outline: none !important;
        font-size: 14px !important;
        font-weight: 500 !important;
        height: 60px !important;
        width: 100%;
        display: block;
        transition: all 0.3s ease;
      }

      input:focus {
        border-color: var(--accent) !important;
        background: rgba(255, 255, 255, 0.08) !important;
      }

      input::placeholder {
        color: var(--text-secondary);
      }

      textarea {
        background: var(--card-bg) !important;
        border: 1px solid var(--border) !important;
        color: var(--text) !important;
        border-radius: 16px !important;
        outline: none !important;
        font-size: 14px !important;
        font-weight: 500 !important;
        display: block;
        transition: all 0.3s ease;
      }

      textarea:focus {
        border-color: var(--accent) !important;
        background: rgba(255, 255, 255, 0.08) !important;
      }

      .error-page {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        text-align: center;
      }

      .mobile-nav {
        background: var(--bg) !important;
        backdrop-filter: blur(20px);
        z-index: 1000;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: #222;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }
      #cookie-banner {
        position: fixed;
        top: 50%;
        left: 50%;
        backdrop-filter: blur(12px);
        border-radius: 25px;
        padding: 16px 24px;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.95);
        transition:
          transform 0.4s ease,
          opacity 0.4s ease;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        max-width: 90%;
        width: 450px;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      #cookie-banner.show {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%) scale(1);
      }

      #cookie-banner p {
        font-size: 13px;
        line-height: 1.5;
        margin: 0 0 12px;
        color: #ffffff;
      }

      #cookie-banner a {
        color: #df6d93;
        text-decoration: none;
        font-weight: 500;
      }

      .cookie-buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .cookie-btn {
        padding: 10px 20px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .cookie-btn.accept {
        background: rgb(0, 255, 136);
        border: 1px solid rgb(0, 255, 136);
        color: #0d0d0d;
      }

      .cookie-btn.reject,
      .cookie-btn.settings {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #e4e4e7;
      }

      .cookie-btn.accept:hover {
        transform: translateY(-1px);
      }

      .cookie-btn.reject:hover,
      .cookie-btn.settings:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.25);
        color: #ffffff;
        transform: translateY(-1px);
      }

      @media (max-width: 640px) {
        #cookie-banner {
          padding: 16px;
          width: calc(100% - 32px);
        }
        .cookie-buttons {
          flex-direction: column;
        }
        .cookie-btn {
          width: 100%;
        }
        .glass-card {
          border-radius: 24px;
        }
        header {
          padding-left: 1rem;
          padding-right: 1rem;
        }
        .nav-link {
          white-space: nowrap;
        }
      }

      .nav-pill {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 6px 10px;
        border-radius: 9999px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        background: rgba(245, 245, 247, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.08),
          0 1px 3px rgba(0, 0, 0, 0.02);
        animation: pillFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes pillFadeIn {
        from {
          opacity: 0;
          transform: translateY(-12px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      [data-theme='dark'] .nav-pill {
        background: rgba(12, 12, 12, 0.85);
        border-color: rgba(255, 255, 255, 0.1);
        box-shadow:
          0 4px 32px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .nav-pill-indicator {
        position: absolute;
        top: 5px;
        left: 0;
        height: calc(100% - 10px);
        border-radius: 9999px;
        background: var(--text);
        opacity: 0.12;
        pointer-events: none;
        transition:
          left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        will-change: left, width;
      }

      [data-theme='dark'] .nav-pill-indicator {
        background: var(--accent);
        opacity: 0.15;
      }

      .nav-pill .nav-link {
        padding: 6px 14px;
        border-radius: 9999px;
        transition: color 0.25s ease;
        white-space: nowrap;
        letter-spacing: 0.1em;
        position: relative;
        color: var(--text);
      }

      html:not([data-theme='dark']) .nav-pill .nav-link {
        color: rgba(0, 0, 0, 0.6);
      }

      .nav-pill .nav-link.active {
        color: var(--accent);
      }

      [data-theme='light'] .nav-pill .nav-link.active {
        color: #000;
      }

      .nav-pill .nav-link::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--accent);
        border-radius: 9999px;
        transform: translateX(-50%);
        transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .nav-pill .nav-link.active::after {
        width: 60%;
      }

      [data-theme='light'] .nav-pill .nav-link.active::after {
        background: #000;
      }

      .lang-switcher {
        position: relative;
        z-index: 1200;
      }

      .lang-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: 14px;
        font-size: 11px;
        font-weight: 700;
        font-family: 'Unbounded', sans-serif;
        letter-spacing: 0.05em;
        cursor: pointer;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        transition: all 0.25s ease;
        white-space: nowrap;
        user-select: none;
      }

      .lang-btn:hover {
        background: rgba(128, 128, 128, 0.1);
        border-color: var(--accent);
      }

      [data-theme='dark'] .lang-btn:hover {
        background: rgba(0, 255, 136, 0.08);
      }

      .lang-btn .lang-arrow {
        display: inline-block;
        font-style: normal;
        font-size: 9px;
        transition: transform 0.25s ease;
        opacity: 0.6;
      }

      .lang-btn.open .lang-arrow {
        transform: rotate(180deg);
      }

      .lang-dropdown {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        min-width: 160px;
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 6px;
        display: none;
        flex-direction: column;
        gap: 2px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      [data-theme='dark'] .lang-dropdown {
        background: rgba(15, 15, 15, 0.97);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      }

      .lang-switcher.open .lang-dropdown {
        display: flex;
        animation: langDropIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes langDropIn {
        from {
          opacity: 0;
          transform: translateY(-6px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .lang-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 700;
        font-family: 'Unbounded', sans-serif;
        letter-spacing: 0.06em;
        cursor: pointer;
        background: transparent;
        border: none;
        color: var(--text);
        transition: all 0.2s ease;
        text-align: left;
        width: 100%;
        white-space: nowrap;
      }

      .lang-option:hover {
        background: rgba(128, 128, 128, 0.1);
      }

      [data-theme='dark'] .lang-option:hover {
        background: rgba(0, 255, 136, 0.1);
        color: #00ff88;
      }

      .lang-option.active {
        color: var(--accent);
        background: rgba(128, 128, 128, 0.08);
      }

      [data-theme='dark'] .lang-option.active {
        background: rgba(0, 255, 136, 0.1);
      }

      .lang-option .lang-flag {
        font-size: 16px;
        line-height: 1;
      }

      .theme-toggle-btn {
        background: rgba(245, 245, 247, 0.85) !important;
        color: rgba(0, 0, 0, 0.6) !important;
      }

      .theme-toggle-btn:hover {
        background: rgba(0, 0, 0, 0.1) !important;
      }

      [data-theme='dark'] .theme-toggle-btn {
        background: transparent !important;
        color: var(--text) !important;
        box-shadow: none !important;
      }

      [data-theme='dark'] .theme-toggle-btn:hover {
        background: rgba(255, 255, 255, 0.1) !important;
      }

      .notifications-btn {
        background: rgba(245, 245, 247, 0.85) !important;
        color: rgba(0, 0, 0, 0.6) !important;
      }

      .notifications-btn:hover {
        background: rgba(0, 0, 0, 0.1) !important;
      }

      [data-theme='dark'] .notifications-btn {
        background: transparent !important;
        border-color: transparent !important;
        color: var(--text) !important;
        box-shadow: none !important;
      }

      [data-theme='dark'] .notifications-btn:hover {
        background: rgba(255, 255, 255, 0.1) !important;
      }

      .page-transition {
        transition: all 0.45s cubic-bezier(0.32, 0.72, 0, 1);
        opacity: 1;
        transform: translateY(0);
        min-height: 70vh;
      }

      .page-transition.opacity-0 {
        opacity: 0 !important;
        transform: translateY(30px) !important;
        transition: all 0.25s cubic-bezier(0.4, 0, 1, 1);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        animation: modalFadeIn 0.25s cubic-bezier(0.23, 1, 0.32, 1) both;
      }

      .modal-overlay.notif-overlay {
        align-items: flex-end;
        padding: 0;
      }

      @keyframes notifSlideUp {
        from {
          opacity: 0;
          transform: translateY(60px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .notif-sheet {
        width: 100%;
        max-height: 85vh;
        border-radius: 2rem 2rem 0 0;
        background: var(--glass);
        border: 1px solid var(--border);
        border-bottom: none;
        box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.4);
        animation: notifSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        overflow: hidden;
        display: flex;
        flex-direction: column;

        useEffect(() => {
          const loadVideos = async () => {
            setIsLoading(true);
            try {
              const overridesSnap = await db
                .collection('settings')
                .doc('video_overrides')
                .get();
              const overrides = overridesSnap.exists
                ? overridesSnap.data()
                : {};

              let finalVk = overrides.vk_override;
              if (!finalVk) {
                finalVk =
                  localStorage.getItem('cached_vk') ||
                  'https://vkvideo.ru/video_ext.php?oid=-209507445&id=456239424&hash=5c6f77d900591ee9&hd=4';
                localStorage.setItem('cached_vk', finalVk);
              }
              setVkUrl(finalVk);

              let finalYt = overrides.yt_override;
              if (!finalYt) {
                finalYt = localStorage.getItem('cached_yt');
                if (!finalYt) {
                  try {
                    const res = await fetch(
                      `https://api.allorigins.win/get?url=${encodeURIComponent(
                        'https://www.youtube.com/feeds/videos.xml?channel_id=UCjrmposCYp6sJsT2VybjH9A'
                      )}`
                    );
                    const data = await res.json();
                    const idMatch = data.contents?.match(
                      /<yt:videoId>([^<]+)<\/yt:videoId>/
                    );
                    if (idMatch?.[1]) {
                      finalYt = `https://www.youtube.com/embed/${idMatch[1]}?rel=0`;
                      localStorage.setItem('cached_yt', finalYt);
                    }
                  } catch (e) {
                    console.warn('YouTube fetch failed', e);
                  }
                }
              }
              setYtUrl(finalYt || '');

              let finalHinata = overrides.hinata_override;
              if (!finalHinata) {
                finalHinata = localStorage.getItem('cached_hinata');
                if (!finalHinata) {
                  try {
                    const res = await fetch(
                      'https://api.github.com/repos/XQR4D/Hinata/releases/latest'
                    );
                    if (res.ok) {
                      const json = await res.json();
                      const asset = json.assets?.find((a) =>
                        a.name.endsWith('.mp4')
                      );
                      if (asset?.browser_download_url) {
                        finalHinata = `https://xqr4d.github.io/Hinata/embed.html?v=${encodeURIComponent(asset.browser_download_url)}`;
                        localStorage.setItem('cached_hinata', finalHinata);
                      }
                    }
                  } catch (e) {
                    console.warn('Hinata fetch failed', e);
                  }
                }
              }
              setHinataUrl(finalHinata || '');
            } catch (err) {
              console.error('Ошибка при загрузке видео:', err);
            } finally {
              setIsLoading(false);
            }
          };

          loadVideos();
        }, []);

        const players = {
          youtube: ytUrl,
          vk: vkUrl,
          hinata: hinataUrl,
        };

        return (
          <div className="max-w-4xl mx-auto space-y-8 md:space-y-12 animate-in fade-in duration-700">

      const NewsPage = ({ navigate, user }) => {
        const { t } = useLang();
        const [posts, setPosts] = useState([]);
        const [loading, setLoading] = useState(true);
        const [showCreateModal, setShowCreateModal] = useState(false);
        const [editingPost, setEditingPost] = useState(null);
        const [newPost, setNewPost] = useState({
          title: '',
          content: '',
          imageUrl: '',
        });

        const isAdmin = React.useMemo(
          () => !!user && ADMINS.includes(user.uid),
          [user]
        );

        useEffect(() => {
          const unsub = db
            .collection('news')
            .orderBy('createdAt', 'desc')
            .onSnapshot(
              (snap) => {
                const data = snap.docs.map((doc) => ({
                  id: doc.id,
                  ...doc.data(),
                }));
                setPosts(data);
                setLoading(false);
              },
              (err) => console.error(err)
            );
          return () => unsub();
        }, []);

        const openEditor = (post = null) => {
          if (post) {
            setEditingPost(post);
            setNewPost({
              title: post.title || '',
              content: post.content || '',
              imageUrl: post.imageUrl || '',
            });
          } else {
            setEditingPost(null);
            setNewPost({ title: '', content: '', imageUrl: '' });
          }
          setShowCreateModal(true);
        };

        const savePost = async () => {
          if (!newPost.title?.trim() || !newPost.content?.trim()) {
            alert('Заголовок и текст обязательны');
            return;
          }

          try {
            const postData = {
              title: newPost.title.trim(),
              content: newPost.content.trim(),
              imageUrl: newPost.imageUrl?.trim() || null,
              authorUid: user?.uid,
              authorName:
                user?.displayName || user?.email?.split('@')[0] || 'Admin',
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            };

            if (editingPost) {
              await db.collection('news').doc(editingPost.id).update(postData);
              alert('Новость обновлена!');
            } else {
              await db.collection('news').add({
                ...postData,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              });
              alert('Новость опубликована!');
            }

            setNewPost({ title: '', content: '', imageUrl: '' });
            setShowCreateModal(false);

      const NewsPostCard = ({ post, user: propUser, isAdmin, openEditor }) => {
        const [comments, setComments] = useState([]);
        const [newComment, setNewComment] = useState('');
        const [replyTo, setReplyTo] = useState(null);
        const [showComments, setShowComments] = useState(false);
        const [commentCount, setCommentCount] = useState(0);
        const [postReactions, setPostReactions] = useState({});

        const currentUser = propUser || auth.currentUser;

        useEffect(() => {
          const unsub = db
            .collection('news')
            .doc(post.id)
            .onSnapshot((doc) => {
              if (doc.exists) {
                const data = doc.data();
                setPostReactions({
                  likes: data.reactions_likes || [],
                  dislikes: data.reactions_dislikes || [],
                  fire: data.reactions_fire || [],
                  heart: data.reactions_heart || [],
                  wow: data.reactions_wow || [],
                });
              }
            });
          return () => unsub();
        }, [post.id]);

        useEffect(() => {
          const unsub = db
            .collection('news')
            .doc(post.id)
            .collection('comments')
            .orderBy('createdAt', 'asc')
            .onSnapshot((snap) => {
              setCommentCount(snap.size);
              if (showComments) {
                setComments(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
              }
            });
          return () => unsub();
        }, [post.id, showComments]);

        const postComment = async () => {
          if (!currentUser) {
            alert('Пожалуйста, войдите в аккаунт');
            return;
          }
          if (!newComment.trim()) return;

          try {
            await db
              .collection('news')
              .doc(post.id)
              .collection('comments')
              .add({
                uid: currentUser.uid,
                displayName:
                  currentUser.displayName ||
                  currentUser.email?.split('@')[0] ||
                  'Пользователь',
                avatar: currentUser.photoURL || null,
                text: newComment.trim(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),

          const userId = currentUser.uid;
          const postRef = db.collection('news').doc(post.id);
          const field = `reactions_${reactionKey}`;

          await db.runTransaction(async (transaction) => {
            const doc = await transaction.get(postRef);
            if (!doc.exists) return;
            const current = doc.data()[field] || [];
            if (current.includes(userId)) {
              transaction.update(postRef, {
                [field]: firebase.firestore.FieldValue.arrayRemove(userId),
              });
            } else {
              transaction.update(postRef, {
                [field]: firebase.firestore.FieldValue.arrayUnion(userId),
              });
            }

            const downvotes = data.downvotes || [];

                transaction.update(commentRef, {
                  upvotes: firebase.firestore.FieldValue.arrayRemove(userId),
                });

                transaction.update(commentRef, {
                  upvotes: firebase.firestore.FieldValue.arrayUnion(userId),
                  downvotes: firebase.firestore.FieldValue.arrayRemove(userId),
                });
              }

                  downvotes: firebase.firestore.FieldValue.arrayRemove(userId),

      const Profile = ({ user, navigate }) => {

          const userRef = db.collection('users').doc(user.uid);

              if (doc.exists) {
                const data = doc.data();
                const adminStatus =
                  data.isAdmin === true || ADMINS.includes(user.uid);
                setIsAdmin(adminStatus);
                setRole(adminStatus ? 'Admin' : 'User');
              }
            })
            .catch((err) => {

            });

                  const data = doc.data();
                  setYtOverride(data.yt_override || '');
                  setVkOverride(data.vk_override || '');
                  setHinataOverride(data.hinata_override || '');

              .catch(console.error);
          }

        const saveVideoOverrides = async () => {
          if (!ADMINS.includes(user.uid)) return;

            await db
              .collection('settings')
              .doc('video_overrides')

                  yt_override: ytOverride.trim() || null,
                  vk_override: vkOverride.trim() || null,
                  hinata_override: hinataOverride.trim() || null,
                  updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                  updatedBy: user.uid,

                { merge: true }

            alert('Ошибка сохранения: ' + err.message);

          setIsUploading(true);

            const formData = new FormData();
            formData.append('image', file);
            const res = await fetch(
              `https://api.imgbb.com/1/upload?key=fac7e04a7bdbc05013b7483b33eae743`,
              {
                method: 'POST',
                body: formData,
              }
            );
            const data = await res.json();
            const url = data.data.url;
            await user.updateProfile({ photoURL: url });
            setAvatar(url);
            alert('Аватар обновлен!');

            alert('Ошибка загрузки');
          } finally {
            setIsUploading(false);
          }

            return;

              displayName: user.displayName || user.email?.split('@')[0] || '',

              title: title,
              imageUrl: imageUrl,
              tableUrl: tableUrl,
              status: 'pending',
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),

            return alert('Пароль должен быть не менее 6 символов!');

            const cred = firebase.auth.EmailAuthProvider.credential(
              user.email,
              cur
            );
            await user.reauthenticateWithCredential(cred);
            await user.updatePassword(np);

            e.target.reset();

              password

      const NavPill = ({ currentPage, navigate, t }) => {
        const pillRef = useRef(null);
        const indicatorRef = useRef(null);

        const updateIndicator = () => {
          if (!pillRef.current || !indicatorRef.current) return;
          const activeBtn = pillRef.current.querySelector('.nav-link.active');
          if (!activeBtn) {
            indicatorRef.current.style.width = '0px';
            return;
          }
          const pillRect = pillRef.current.getBoundingClientRect();
          const btnRect = activeBtn.getBoundingClientRect();
          indicatorRef.current.style.left = btnRect.left - pillRect.left + 'px';
          indicatorRef.current.style.width = btnRect.width + 'px';
        };

        useEffect(() => {
          const raf = requestAnimationFrame(updateIndicator);
          return () => cancelAnimationFrame(raf);
        }, [currentPage]);

        return (
          <div
            ref={pillRef}
            className="nav-pill text-[10px] font-medium uppercase"
          >
            <div ref={indicatorRef} className="nav-pill-indicator" />
            {NAV_ITEMS.map(({ key, labelKey }) => (
              <button
                key={key}
                onClick={() => navigate(key)}

      const Notifications = ({ user }) => {
        const { t } = useLang();
        const [notifications, setNotifications] = useState([]);
        const [showNotif, setShowNotif] = useState(false);
        const [lastReadTimestamp, setLastReadTimestamp] = useState(null);
        const isAdmin = user && ADMINS.includes(user.uid);
        const panelRef = useRef(null);

        useEffect(() => {
          if (!user) return;

          const unsub = db
            .collection('notifications')
            .orderBy('createdAt', 'desc')
            .limit(30)
            .onSnapshot(
              (snap) => {
                const data = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                setNotifications(data);
              },
              (err) => console.error('Notifications error:', err)
            );

          db.collection('users')
            .doc(user.uid)
            .get()
            .then((doc) => {
              if (doc.exists && doc.data().lastReadNotifications) {
                setLastReadTimestamp(doc.data().lastReadNotifications);
              }
            });

          return () => unsub();
        }, [user]);

        useEffect(() => {
          const handleClickOutside = (e) => {
            if (panelRef.current && !panelRef.current.contains(e.target)) {
              setShowNotif(false);
            }
          };
          document.addEventListener('mousedown', handleClickOutside);
          return () =>
            document.removeEventListener('mousedown', handleClickOutside);
        }, []);

        const openNotifications = () => {
          const newState = !showNotif;
          setShowNotif(newState);

          if (newState && user) {
            const now = firebase.firestore.FieldValue.serverTimestamp();
            db.collection('users')
              .doc(user.uid)
              .set(
                {
                  lastReadNotifications: now,
                },
                { merge: true }
              )
              .then(() => {
                setLastReadTimestamp(now);
              });
          }
        };

        const unreadCount = React.useMemo(() => {
          if (!lastReadTimestamp) return notifications.length;

          return notifications.filter((n) => {
            if (!n.createdAt) return true;
            const notificationTime = n.createdAt.toDate
              ? n.createdAt.toDate()
              : new Date(n.createdAt);
            const lastReadTime = lastReadTimestamp.toDate
              ? lastReadTimestamp.toDate()
              : new Date(lastReadTimestamp);
            return notificationTime > lastReadTime;
          }).length;
        }, [notifications, lastReadTimestamp]);

        const sendNotification = async () => {
          if (!isAdmin) return;
          const text = prompt('Введите текст уведомления');
          if (!text || !text.trim()) return;

          try {
            await db.collection('notifications').add({
              text: text.trim(),
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              author: user.displayName || user.email || 'Админ',
            });
            alert('Уведомление успешно отправлено!');
          } catch (e) {
            alert('Ошибка: ' + e.message);
          }
        };

        const formatNotifText = (text) => {
          if (!text) return '';
          return text.replace(
            /(https?:\/\/[^\s]+)/g,
            '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline">$1</a>'
          );
        };

        return (
          <div className="relative">
            <button
              onClick={openNotifications}
              className="p-3 rounded-2xl transition-all relative z-10 notifications-btn"
              title="Уведомления"
            >
              <svg
                xmlns="http://w3.org"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                className="lucide lucide-bell"
              >
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
              </svg>

              {unreadCount > 0 && (
                <div className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-[10px] rounded-full flex items-center justify-center text-white font-bold">
                  {unreadCount > 9 ? '9+' : unreadCount}
                </div>
              )}
            </button>

            {showNotif &&
              ReactDOM.createPortal(
                <div
                  className="modal-overlay notif-overlay"
                  onClick={(e) => {
                    if (e.target === e.currentTarget) setShowNotif(false);
                  }}
                >
                  <div
                    ref={panelRef}
                    className="notif-sheet"
                    onClick={(e) => e.stopPropagation()}
                  >
                    <div className="notif-handle" />

                    <div className="notif-header">
                      <div className="flex items-center gap-3">
                        <div>
                          <h4 className="font-black text-base tracking-tight leading-none">
                            {t.notifTitle}
                          </h4>
                          {notifications.length > 0 && (
                            <p className="text-[10px] opacity-40 uppercase tracking-widest mt-0.5">
                              {notifications.length}{' '}
                              {notifications.length === 1
                                ? 'сообщение'
                                : 'сообщений'}
                            </p>
                          )}
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        {isAdmin && (
                          <button
                            onClick={sendNotification}
                            className="btn-primary text-[11px] px-4 py-2 rounded-xl"
                          >
                            {t.notifSend}
                          </button>
                        )}
                        <button
                          onClick={() => setShowNotif(false)}

                                  <p className="text-[10px] opacity-40 mt-2 uppercase tracking-wider">
                                    {n.createdAt?.toDate

                                          .toDate()
                                          .toLocaleString('ru-RU')
                                      : ''}
                                  </p>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>,

          </div>
        );

    <script>
      let themeInitialized = false;

      function initTheme() {
        if (themeInitialized) return;
        themeInitialized = true;

        const savedTheme = localStorage.getItem('bipbup-theme');
        const isFirstVisit = !localStorage.getItem('bipbup-visited');

        if (isFirstVisit) {
          localStorage.setItem('bipbup-visited', 'true');
          document.documentElement.setAttribute('data-theme', 'light');
        } else if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        updateThemeIcon();
      }

      function toggleTheme() {
        const current =
          document.documentElement.getAttribute('data-theme') || 'light';
        const newTheme = current === 'dark' ? 'light' : 'dark';

        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('bipbup-theme', newTheme);
        updateThemeIcon();
      }

      function updateThemeIcon() {}

      window.addEventListener('load', () => {
        initTheme();

        setTimeout(() => {
          const btn = document.getElementById('theme-toggle');
          if (btn) {
            btn.addEventListener('click', toggleTheme);
          }
        }, 300);
      });
    </script>

        (function (m, e, t, r, i, k, a) {
          m[i] =

            function () {
              (m[i].a = m[i].a || []).push(arguments);
            };
          m[i].l = 1 * new Date();
          for (var j = 0; j < document.scripts.length; j++) {
            if (document.scripts[j].src === r) {
              return;
            }
          }
          ((k = e.createElement(t)),
            (a = e.getElementsByTagName(t)[0]),
            (k.async = 1),
            (k.src = r),
            a.parentNode.insertBefore(k, a));
        })(
          window,
          document,
          'script',
          'https://mc.yandex.ru/metrika/tag.js',
          'ym'
        );

        ym(99936739, 'init', {
          clickmap: true,

          webvisor: true,
        });
      }

      function hasCookieConsent() {
        return localStorage.getItem('cookieConsent') === 'accepted';
      }

      function showCookieBanner() {
        const banner = document.getElementById('cookie-banner');
        if (banner && !hasCookieConsent()) {
          setTimeout(() => banner.classList.add('show'), 800);
        }
      }

      function acceptCookies() {
        localStorage.setItem('cookieConsent', 'accepted');
        document.getElementById('cookie-banner').classList.remove('show');
        initYandexMetrika();
      }

      function rejectCookies() {
        localStorage.setItem('cookieConsent', 'rejected');
        document.getElementById('cookie-banner').classList.remove('show');
      }

      document.addEventListener('DOMContentLoaded', () => {
        showCookieBanner();

        if (hasCookieConsent()) {
          initYandexMetrika();
        }

        document
          .getElementById('cookie-accept')
          ?.addEventListener('click', acceptCookies);
        document
          .getElementById('cookie-reject')
          ?.addEventListener('click', rejectCookies);
      });
