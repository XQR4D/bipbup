            const [length, setLength] = useState(16);
            const [upper, setUpper] = useState(true);

            const [numbers, setNumbers] = useState(true);
            const [symbols, setSymbols] = useState(true);

                let chars = '';
                if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
                if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                if (numbers) chars += '0123456789';

                    return;
                }

                let pw = '';
                for (let i = 0; i < length; i++) {
                    pw += chars.charAt(Math.floor(Math.random() * chars.length));

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('background-canvas');
            const ctx = canvas.getContext('2d');
           
            let width, height;
            let orbs = [];
           
            const colorPalette = [
                { hex: '#00ff88', baseR: 0, baseG: 255, baseB: 136 },
                { hex: '#00ff88', baseR: 0, baseG: 255, baseB: 136 },
                { hex: '#00ff88', baseR: 0, baseG: 255, baseB: 136 },
                { hex: '#00ff88', baseR: 0, baseG: 255, baseB: 136 },
                { hex: '#00ff88', baseR: 0, baseG: 255, baseB: 136 },
                { hex: '#00ff88', baseR: 0, baseG: 255, baseB: 136 },
                { hex: '#00ff88', baseR: 0, baseG: 255, baseB: 136 }
            ];
            const orbCount = 5;
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                initOrbs();
            }
            class Orb {
                constructor() {
                    this.setRandomValues();
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                }
                setRandomValues() {
                    this.radius = Math.random() * 300 + 200;
                    this.color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = (Math.random() - 0.5) * 0.8;
                    this.sinOffset = Math.random() * Math.PI * 2;
                    this.pulseSpeed = 0.02;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < -this.radius) this.vx *= -1;
                    if (this.x > width + this.radius) this.vx *= -1;
                    if (this.y < -this.radius) this.vy *= -1;
                    if (this.y > height + this.radius) this.vy *= -1;
                    this.sinOffset += this.pulseSpeed;
                }
                draw() {
                    const currentRadius = this.radius + Math.sin(this.sinOffset) * 50;
                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, currentRadius
                    );
                    gradient.addColorStop(0, `rgba(${this.color.baseR}, ${this.color.baseG}, ${this.color.baseB}, 0.35)`);
                    gradient.addColorStop(0.5, `rgba(${this.color.baseR}, ${this.color.baseG}, ${this.color.baseB}, 0.1)`);
                    gradient.addColorStop(1, `rgba(${this.color.baseR}, ${this.color.baseG}, ${this.color.baseB}, 0)`);
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            function initOrbs() {
                orbs = [];
                for (let i = 0; i < orbCount; i++) {
                    orbs.push(new Orb());
                }
            }
            function animate() {
                ctx.clearRect(0, 0, width, height);
                ctx.globalCompositeOperation = 'screen';
                for (let orb of orbs) {
                    orb.update();
                    orb.draw();
                }
                ctx.globalCompositeOperation = 'source-over';
                requestAnimationFrame(animate);
            }
            window.addEventListener('resize', resize);
            resize();
            animate();
        });
    </script>
