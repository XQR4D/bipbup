    <style>
      :root {
        --accent: #000000;
        --bg: #ededed;
        --card-bg: rgba(0, 0, 0, 0.03);
        --border: rgba(0, 0, 0, 0.08);
        --text: #000000;
        --text-secondary: rgba(0, 0, 0, 0.75);
        --glass: rgba(255, 255, 255, 0.95);
      }

      [data-theme="dark"] {
        --accent: #00ff88;
        --bg: #0a0a0a;
        --card-bg: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.12);
        --text: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.75);
        --glass: rgba(15, 15, 15, 0.95);
      }

      [data-theme="light"] .nav-link:hover,
      [data-theme="light"] .nav-link.active {
        color: var(--accent);
      }

      [data-theme="light"] .nav-link.btn-login {
        border: 1px solid rgba(0, 0, 0, 0.15);
        color: var(--text);
      }

      [data-theme="light"] .nav-link.btn-login:hover {
        background: rgba(0, 0, 0, 0.05);
        color: var(--accent);
      }

      [data-theme="light"] .glass-card {
        background: rgba(31, 30, 30, 0.062) !important;
        color: #000 !important;
      }

      [data-theme="dark"] .nav-link.btn-login {
        border-color: rgba(255, 255, 255, 0.2);
        color: #ffffff;
      }

      [data-theme="dark"] .nav-link.btn-login:hover {
        background: rgba(0, 255, 136, 0.1);
        border-color: var(--accent);
      }

      [data-theme="dark"] .glass-card.group:hover {
        border-color: var(--accent);
      }

      [data-theme="dark"] .glass-card.group:hover .text-\[9px\] {
        color: var(--accent) !important;
      }

      [data-theme="dark"] button.btn-primary {
        background: rgb(0, 255, 136);
        color: #000000;
        border: 1px solid rgba(0, 255, 136, 0.3);
      }

      [data-theme="dark"] .glass-card:hover {
        border-color: var(--accent);
      }

      [data-theme="dark"] a.bg-black\/5,
      [data-theme="dark"] a.border-black\/10 {
        background: rgba(255, 255, 255, 0.08) !important;
        border-color: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
      }

      [data-theme="dark"] .text-\[\#000000\] {
        color: #ffffff !important;
      }

      [data-theme="dark"] .btn-primary {
        background: rgb(0, 255, 136);
        color: #000000;
        border: none;
      }

      [data-theme="dark"] input {
        background: rgba(255, 255, 255, 0.06) !important;
        border-color: rgba(255, 255, 255, 0.15) !important;
      }

      [data-theme="dark"] .admin-role-select {
        color-scheme: dark;
        color: var(--text);
        background-color: #101a15;
      }

      [data-theme="dark"] .admin-role-select option {
        color: #ffffff;
        background-color: #101a15;
      }

      [data-theme="light"] .admin-role-select {
        color-scheme: light;
        color: var(--text);
        background-color: var(--glass);
      }

      [data-theme="light"] .admin-role-select option {
        color: #111111;
        background-color: #ffffff;
        color: #ffffff !important;
      }

      [data-theme="dark"] input:focus {
        border-color: var(--accent) !important;
        background: rgba(0, 255, 136, 0.08) !important;
      }

      [data-theme="dark"] textarea {
        background: rgba(255, 255, 255, 0.06) !important;
        border-color: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
      }

      [data-theme="dark"] textarea:focus {
        border-color: var(--accent) !important;
        background: rgba(0, 255, 136, 0.08) !important;
      }

      [data-theme="dark"] .glass-card {
        background: rgba(255, 255, 255, 0.014);
      }

      [data-theme="dark"] .text-\[\#000000\] {
        color: #ffffff !important;
      }

      [data-theme="dark"] .text-\[\#000000\].text-lg,
      [data-theme="dark"] .text-\[\#000000\].text-xl,
      [data-theme="dark"] .text-\[\#000000\].md\:text-xl {
        color: #ffffff !important;
      }

      [data-theme="dark"] .glass-card p.text-\[\#000000\],
      [data-theme="dark"] .glass-card div.text-\[\#000000\] {
        color: #ffffff !important;
      }

      [data-theme="light"] .cookie-btn.accept {
        background: #0d0d0d;
        color: #ffffff;
        border: 1px solid #0d0d0d;
      }

      [data-theme="light"] .cookie-btn.reject,
      [data-theme="light"] .cookie-btn.settings {
        background: rgba(0, 0, 0, 0.05);
        color: #ffffff;
        border: 1px solid rgba(0, 0, 0, 0.15);
      }

      [data-theme="light"] .cookiez {
        color: #ffffff;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: "Unbounded", sans-serif;
        overflow-x: hidden;
        margin: 0;
        transition: background-color 0.45s cubic-bezier(0.23, 1, 0.32, 1);
      }

      #background-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      button,
      [type="button"],
      [type="submit"],
      [type="reset"] {
        appearance: none !important;
        -webkit-appearance: none !important;
        background-image: none;
      }

      .glass-card {
        background: var(--card-bg);
        background-image: none;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        isolation: isolate;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      button.glass-card {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .glass-card:hover {
        border-color: var(--accent);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      [data-theme="dark"] .glass-card:hover {
        background: rgba(0, 255, 136, 0.12);
      }

      .accent-text {
        color: var(--accent);
        text-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      }

      .nav-link {
        position: relative;
        padding: 8px 0;
        cursor: pointer;
        color: var(--text);
      }

      .nav-link.btn-login {
        border: 1px solid rgba(0, 0, 0, 0.1);
        padding: 8px 20px;
        border-radius: 9999px;
      }

      .site-footer {
        position: relative;
        width: 100%;
        margin-top: 88px;
        background: color-mix(in srgb, var(--bg) 76%, transparent);
        color: var(--text);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .site-footer-inner {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
        gap: 56px;
        width: min(100%, 1152px);
        margin: 0 auto;
        padding: 48px 24px 36px;
      }

      .footer-brand {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .footer-social-block {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .footer-monogram {
        color: var(--text);
        font-size: 112px;
        font-weight: 900;
        line-height: 0.9;
        white-space: nowrap;
      }

      [data-theme="light"] .footer-monogram img {
        filter: brightness(0);
      }

      .footer-copyright {
        margin: 0;
        color: var(--text-secondary);
        font-size: 9px;
      }

      .footer-column-title {
        color: var(--text-secondary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .footer-link {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        width: fit-content;
        color: var(--text-secondary);
        font-size: 11px;
        line-height: 1.7;
        text-align: left;
        transition:
          color 0.2s ease,
          opacity 0.2s ease;
      }

      .footer-link-icon {
        display: inline-flex;
        flex: 0 0 20px;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        color: var(--text-secondary);
        background: var(--card-bg);
        transition:
          color 0.2s ease,
          border-color 0.2s ease,
          background 0.2s ease;
      }

      .footer-link-icon svg {
        width: 11px;
        height: 11px;
        transition: transform 0.2s ease;
      }

      .footer-link:hover,
      .footer-link:focus-visible {
        color: var(--accent);
        outline: none;
      }

      .footer-link:hover .footer-link-icon,
      .footer-link:focus-visible .footer-link-icon {
        border-color: color-mix(in srgb, var(--accent) 38%, var(--border));
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, var(--card-bg));
      }

      .footer-link:hover .footer-link-icon svg,
      .footer-link:focus-visible .footer-link-icon svg {
        transform: translate(1px, -1px);
      }

      .footer-socials {
        display: grid;
        grid-template-columns: repeat(4, 40px);
        gap: 8px;
      }

      .footer-socials .social-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 13px;
        background: var(--card-bg);
        transition:
          border-color 0.2s ease,
          transform 0.2s ease,
          background 0.2s ease;
      }

      .footer-socials .social-icon:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, var(--card-bg));
      }

      .footer-legal-links {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .news-action-button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 9999px;
        padding: 9px 15px;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
        transition:
          transform 0.2s ease,
          background 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .news-action-button:hover {
        transform: translateY(-1px);
      }

      .news-action-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .news-action-share {
        border-color: rgba(16, 185, 129, 0.4);
        background: rgba(16, 185, 129, 0.09);
        color: #047857;
      }

      .news-action-share:hover {
        border-color: rgba(16, 185, 129, 0.65);
        background: rgba(16, 185, 129, 0.16);
        box-shadow: 0 5px 18px rgba(16, 185, 129, 0.12);
      }

      [data-theme="dark"] .news-action-share {
        border-color: rgba(0, 255, 136, 0.4);
        background: rgba(0, 255, 136, 0.08);
        color: var(--accent);
      }

      [data-theme="dark"] .news-action-share:hover {
        border-color: rgba(0, 255, 136, 0.65);
        background: rgba(0, 255, 136, 0.15);
        box-shadow: 0 5px 18px rgba(0, 255, 136, 0.12);
      }

      .news-action-delete {
        border-color: rgba(239, 68, 68, 0.38);
        background: rgba(239, 68, 68, 0.09);
        color: #ef4444;
      }

      .news-action-delete:hover {
        border-color: rgba(239, 68, 68, 0.65);
        background: rgba(239, 68, 68, 0.16);
      }

      .news-action-reply,
      .news-action-comments {
        background: var(--card-bg);
        color: var(--text-secondary);
      }

      .news-action-reply:hover,
      .news-action-comments:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .news-post-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
      }

      .news-detail-back {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        border-radius: 9999px;
        padding: 11px 17px;
        background: var(--card-bg);
        font-size: 13px;
        font-weight: 700;
        transition:
          border-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }

      .news-detail-back:hover {
        transform: translateX(-2px);
        border-color: var(--accent);
        color: var(--accent);
      }

      @media (max-width: 700px) {
        .news-action-button {
          max-width: 100%;
          padding: 9px 12px;
          white-space: normal;
          text-align: center;
        }

        .news-post-actions {
          gap: 8px;
        }

        .site-footer {
          margin-top: 56px;
        }

        .site-footer-inner {
          grid-template-columns: minmax(0, 1fr);
          justify-items: center;
          gap: 30px;
          padding: 34px 20px 28px;
          text-align: center;
        }

        .footer-brand {
          align-items: center;
          gap: 14px;
        }

        .footer-social-block {
          align-items: center;
        }

        .footer-legal-links {
          align-items: center;
          gap: 8px 14px;
        }
      }

      @media (max-width: 380px) {
        .footer-brand {
          gap: 20px;
        }

        .footer-monogram {
          font-size: 84px;
        }
      }

      @keyframes flipOut {
        0% {
          opacity: 1;
          transform: translateY(0) skewY(0deg) scale(1);
        }
        70% {
          opacity: 0;
        }
        100% {
          opacity: 0;
          transform: translateY(-18px) scale(0.985);
        }
      }
      @keyframes flipIn {
        0% {
          opacity: 0;
          transform: translateY(18px) scale(0.985);
        }
        70% {
          opacity: 0.8;
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .hero-text-flip {
        display: inline-block;
        animation: flipIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }
      .hero-text-flip.out {
        animation: flipOut 0.35s cubic-bezier(0.4, 0, 1, 1) forwards;
      }

      @keyframes heroSectionIn {
        0% {
          opacity: 0;
          transform: translateY(28px) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .hero-section-animate {
        animation: heroSectionIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .hero-btn-animate {
        animation: heroSectionIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
      }
      .home-cards-animate {
        animation: heroSectionIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both;
      }

      .home-link-card {
        position: relative;
        min-height: 220px;
        isolation: isolate;
        overflow: hidden;
        border-color: var(--border);
        background: var(--card-bg);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .home-link-card::before {
        content: "";
        position: absolute;
        inset: auto -20% -55% 20%;
        height: 180px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0;
        filter: blur(45px);
        transform: translateY(24px);
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
        z-index: -1;
      }

      .home-link-card:hover {
        border-color: var(--accent);
        transform: translateY(-6px) !important;
        box-shadow: 0 24px 45px rgba(0, 0, 0, 0.2);
      }

      .home-link-card:hover::before {
        opacity: 0.1;
        transform: translateY(0);
      }

      .home-link-icon {
        width: 48px;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        color: var(--text-secondary);
        background: rgba(128, 128, 128, 0.08);
        transition:
          color 0.3s ease,
          background 0.3s ease,
          transform 0.3s ease;
      }

      .home-link-card:hover .home-link-icon {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        transform: rotate(-6deg) scale(1.06);
      }

      .hero-knowledge-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-width: 270px;
        border: 1px solid transparent;
        transition:
          transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 0.3s ease,
          background 0.3s ease;
      }

      .hero-knowledge-btn .hero-knowledge-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .hero-knowledge-btn .hero-knowledge-arrow {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        font-size: 13px;
        line-height: 1;
        transition:
          transform 0.3s ease,
          background 0.3s ease,
          color 0.3s ease;
      }

      .hero-knowledge-btn:hover {
        transform: translateY(-3px) scale(1.02);
      }

      .hero-knowledge-btn:hover .hero-knowledge-arrow {
        transform: translate(2px, -2px);
        background: rgba(255, 255, 255, 0.16);
        color: inherit;
      }

      .tool-switch-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .tool-switch-icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      .player-stage {
        overflow: hidden;
        border-radius: 2.5rem;
        background: var(--card-bg);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.14);
      }

      .player-video-shell {
        padding: 16px;
      }

      .player-stage .player-select-panel {
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
        border-radius: 0;
        background: transparent;
      }

      .player-companion-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .player-select-panel {
        grid-column: 1 / -1;
        padding: 22px;
        background: var(--card-bg);
      }

      .player-select-heading {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        color: var(--text-secondary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .player-select-options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding: 5px;
        border-radius: 17px;
        background: rgba(128, 128, 128, 0.06);
      }

      .player-select-option {
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 10px 12px;
        border-radius: 13px;
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition:
          background 0.25s ease,
          color 0.25s ease,
          transform 0.25s ease;
      }

      .player-select-option:hover {
        background: rgba(128, 128, 128, 0.12);
        color: var(--text);
      }

      .player-select-option.active {
        color: var(--accent);
        background: var(--glass);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
      }

      .player-option-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 27px;
        height: 27px;
        font-size: 8px;
        letter-spacing: 0;
      }

      .player-option-icon {
        max-width: 18px;
        max-height: 18px;
        object-fit: contain;
      }

      .player-companion-card {
        min-height: 142px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 20px;
        border-radius: 24px;
        background: var(--card-bg);
        transition:
          transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }

      .player-companion-card:hover {
        border-color: var(--accent);
        transform: translateY(-4px);
        box-shadow: 0 20px 35px rgba(0, 0, 0, 0.16);
      }

      .player-companion-logo {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .player-companion-logo img {
        max-width: 46px;

      const PasswordGenerator = () => {
        const { t } = useLang();
        const [length, setLength] = useState(16);
        const [upper, setUpper] = useState(true);
        const [lower, setLower] = useState(true);
        const [numbers, setNumbers] = useState(true);
        const [symbols, setSymbols] = useState(true);
        const [password, setPassword] = useState("");

        const generate = () => {
          let chars = "";
          if (lower) chars += "abcdefghijklmnopqrstuvwxyz";
          if (upper) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
          if (numbers) chars += "0123456789";
          if (symbols) chars += "!@#$%^&*()_+-=[]{}|;:,.<>?";

          if (chars === "") {
            alert(t.passNoChars);
            return;
          }

          let pw = "";
          for (let i = 0; i < length; i++) {
            pw += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          setPassword(pw);
        };

        const copy = () => {
          if (password) {
            navigator.clipboard.writeText(password);
            alert(t.passCopied);
          }
        };

        return (
          <div className="text-center space-y-8 animate-in fade-in duration-300">
            <h3 className="text-2xl font-black tracking-tighter">
              {t.passTitle}
            </h3>

                <label className="text-[9px] uppercase opacity-40 font-bold tracking-widest">
                  {t.passLength}
                </label>
                <input
                  type="number"
                  min="8"
                  max="64"
                  value={length}
                  onChange={(e) =>
                    setLength(
                      Math.max(8, Math.min(64, parseInt(e.target.value) || 8)),
                    )
                  }
                  className="text-xl font-bold"
                />
              </div>
              <div className="grid grid-cols-2 gap-4 text-sm">
                <label className="flex items-center gap-3">
                  <input
                    type="checkbox"
                    checked={upper}
                    onChange={(e) => setUpper(e.target.checked)}
                    className="w-5 h-5"
                  />{" "}
                  A-Z
                </label>
                <label className="flex items-center gap-3">
                  <input
                    type="checkbox"
                    checked={lower}
                    onChange={(e) => setLower(e.target.checked)}
                    className="w-5 h-5"
                  />{" "}
                  a-z
                </label>
                <label className="flex items-center gap-3">
                  <input
                    type="checkbox"
                    checked={numbers}
                    onChange={(e) => setNumbers(e.target.checked)}
                    className="w-5 h-5"
                  />{" "}
                  0-9
                </label>
                <label className="flex items-center gap-3">
                  <input
                    type="checkbox"
                    checked={symbols}
                    onChange={(e) => setSymbols(e.target.checked)}
                    className="w-5 h-5"
                  />{" "}
                  !@#...
                </label>
              </div>
              <button
                onClick={generate}
                className="btn-primary w-full py-5 rounded-2xl text-xs uppercase tracking-[0.3em] font-black"
              >
                {t.generate}
              </button>
              <div onClick={copy} className="cursor-pointer group py-8">
                <div className="text-2xl md:text-3xl font-bold break-all text-transparent bg-clip-text bg-gradient-to-r from-white to-[#000000] group-hover:scale-105 transition-transform">
                  {password || "..."}
                </div>
                {password && (
                  <p className="text-[10px] opacity-0 group-hover:opacity-50 mt-2 uppercase tracking-widest">
                    {t.clickToCopy}
                  </p>
                )}
              </div>
            </div>
          </div>
        );
      };

      const LevelCalculator = () => {
        const { t } = useLang();
        const [currentLevel, setCurrentLevel] = useState(1);
        const [expPerPayday, setExpPerPayday] = useState(1);
        const [hasX2, setHasX2] = useState(false);
        const [paydaysToNext, setPaydaysToNext] = useState(0);
        const [expNeeded, setExpNeeded] = useState(0);

        useEffect(() => {
          const baseExpToNext = currentLevel * 2;
          const multiplier = hasX2 ? 2 : 1;
          const effectiveExp = expPerPayday * multiplier;

          const needed = Math.max(0, baseExpToNext);
          const paydays =
            effectiveExp > 0 ? Math.ceil(needed / effectiveExp) : 0;

          setExpNeeded(needed);
          setPaydaysToNext(paydays);
        }, [currentLevel, expPerPayday, hasX2]);

        return (
          <div className="space-y-8 animate-in fade-in duration-300">

            </div>

        );

        const [lastPamyatkaDoc, setLastPamyatkaDoc] = useState(null);
        const [hasMorePamyatki, setHasMorePamyatki] = useState(false);
        const [isLoadingMorePamyatki, setIsLoadingMorePamyatki] =
          useState(false);
        const [project, setProject] = useState("gta5rp");
        const pageSize = 12;

        useEffect(() => {
          const unsub = db
            .collection("pamyatki")
            .where("status", "==", "approved")
            .orderBy("createdAt", "desc")
            .limit(pageSize + 1)
            .onSnapshot(
              (snap) => {
                const pageDocs = snap.docs.slice(0, pageSize);
                const data = pageDocs.map((doc) => ({
                  ...doc.data(),
                  id: doc.id,
                }));
                const currentPageIds = new Set(data.map((memo) => memo.id));
                setPamyatki((current) => [
                  ...data,
                  ...current.filter((memo) => !currentPageIds.has(memo.id)),
                ]);
                setLastPamyatkaDoc(
                  pageDocs.length ? pageDocs[pageDocs.length - 1] : null,
                );
                setHasMorePamyatki(snap.docs.length > pageSize);
                setIsLoadingPamyatki(false);
              },
              (err) => {
                console.error(err);
                setIsLoadingPamyatki(false);
              },
            );
          return () => unsub();
        }, []);

        const loadMorePamyatki = async () => {
          if (!lastPamyatkaDoc || isLoadingMorePamyatki) return;
          setIsLoadingMorePamyatki(true);

          try {
            const snap = await db
              .collection("pamyatki")
              .where("status", "==", "approved")
              .orderBy("createdAt", "desc")
              .startAfter(lastPamyatkaDoc)
              .limit(pageSize + 1)
              .get();
            const pageDocs = snap.docs.slice(0, pageSize);
            const data = pageDocs.map((doc) => ({
              ...doc.data(),
              id: doc.id,
            }));

            setPamyatki((current) => {
              const currentIds = new Set(current.map((memo) => memo.id));
              return [
                ...current,
                ...data.filter((memo) => !currentIds.has(memo.id)),
              ];
            });
            if (pageDocs.length) {
              setLastPamyatkaDoc(pageDocs[pageDocs.length - 1]);
            }

          const loadVideos = async () => {
            setIsLoading(true);
            try {
              const overridesSnap = await db
                .collection("settings")
                .doc("video_overrides")
                .get();
              const overrides = overridesSnap.exists
                ? overridesSnap.data()
                : {};

              let finalVk = overrides.vk_override;
              if (!finalVk) {
                finalVk =
                  localStorage.getItem("cached_vk") ||
                  "https://vkvideo.ru/video_ext.php?oid=-209507445&id=456239424&hash=5c6f77d900591ee9&hd=4";
                localStorage.setItem("cached_vk", finalVk);
              }
              setVkUrl(finalVk);

              let finalYt = overrides.yt_override;
              if (!finalYt) {
                finalYt = localStorage.getItem("cached_yt");
                if (!finalYt) {
                  try {
                    const res = await fetch(
                      `https://api.allorigins.win/get?url=${encodeURIComponent(
                        "https://www.youtube.com/feeds/videos.xml?channel_id=UCjrmposCYp6sJsT2VybjH9A",
                      )}`,
                    );
                    const data = await res.json();
                    const idMatch = data.contents?.match(
                      /<yt:videoId>([^<]+)<\/yt:videoId>/,
                    );
                    if (idMatch?.[1]) {
                      finalYt = `https://www.youtube.com/embed/${idMatch[1]}?rel=0`;
                      localStorage.setItem("cached_yt", finalYt);
                    }
                  } catch (e) {
                    console.warn("YouTube fetch failed", e);
                  }
                }
              }
              setYtUrl(finalYt || "");

                      </button>
                      {mode === "login" && (
                        <button
                          type="button"
                          onClick={() => setMode("reset")}
                          className="w-full text-[9px] opacity-40 uppercase hover:opacity-100 transition"
                        >
                          {t.forgotPass}
                        </button>
                      )}
                    </form>
                    {mode === "login" && (
                      <div className="grid grid-cols-2 gap-4">
                        <button
                          onClick={handleGoogleLogin}
                          className="auth-social-button glass-card group flex flex-col items-center justify-center transition-all duration-300"
                        >
                          <svg
                            className="w-6 h-6 mb-2 transition-all duration-500"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                          >
                            <path
                              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                              fill="#4285F4"
                            />
                            <path
                              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.07-3.71 1.07-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                              fill="#34A853"
                            />
                            <path
                              d="M5.84 14.09c-.22-.67-.35-1.39-.35-2.09s.13-1.42.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                              fill="#FBBC05"
                            />
                            <path
                              d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z"
                              fill="#EA4335"
                            />
                          </svg>
                          <span className="text-[9px] uppercase font-black tracking-widest opacity-40 group-hover:opacity-100">
                            Google
                          </span>
                        </button>

                        <button
                          onClick={handleGithubLogin}
                          className="auth-social-button glass-card group flex flex-col items-center justify-center transition-all duration-300"
                        >
                          <svg
                            className="w-5 h-5 mb-2 opacity-100"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                          >
                            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
                          </svg>
                          <span className="text-[9px] uppercase font-black tracking-widest opacity-40 group-hover:opacity-100">
                            GitHub
                          </span>
                        </button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      const NewsPage = ({ navigate, user }) => {
        const { t } = useLang();
        const [posts, setPosts] = useState([]);
        const [loading, setLoading] = useState(true);
        const [isTechSupport, setIsTechSupport] = useState(false);
        const [newsRoute, setNewsRoute] = useState(getNewsRoute);
        const [showCreateModal, setShowCreateModal] = useState(false);
        const [editingPost, setEditingPost] = useState(null);
        const [newPost, setNewPost] = useState({
          title: "",
          content: "",
          imageUrl: "",
        });

        const isAdmin = React.useMemo(
          () => !!user && ADMINS.includes(user.uid),
          [user],
        );
        const canModerate = React.useMemo(
          () => !!user && (ADMINS.includes(user.uid) || isTechSupport),
          [user, isTechSupport],
        );

        useEffect(() => {
          if (!user) {
            setIsTechSupport(false);
            return;
          }
          return db
            .collection("users")
            .doc(user.uid)
            .onSnapshot(
              (doc) =>
                setIsTechSupport(
                  doc.exists && doc.data().role === "tech_support",
                ),
              (error) => console.error("Failed to load moderator role:", error),
            );
        }, [user?.uid]);

        useEffect(() => {
          const handleNewsHashChange = () => setNewsRoute(getNewsRoute());
          window.addEventListener("hashchange", handleNewsHashChange);
          return () =>
            window.removeEventListener("hashchange", handleNewsHashChange);
        }, []);

        useEffect(() => {
          if (loading || !newsRoute.postId) return;
          document
            .getElementById(`news-post-${newsRoute.postId}`)
            ?.scrollIntoView({ behavior: "smooth", block: "start" });
        }, [loading, newsRoute.postId, posts]);

        useEffect(() => {
          const unsub = db
            .collection("news")
            .orderBy("createdAt", "desc")
            .onSnapshot(
              (snap) => {
                const data = snap.docs.map((doc) => ({
                  id: doc.id,
                  ...doc.data(),
                }));
                setPosts(data);
                setLoading(false);
              },
              (err) => console.error(err),
            );
          return () => unsub();
        }, []);

        const openEditor = (post = null) => {
          if (post) {
            setEditingPost(post);
            setNewPost({
              title: post.title || "",
              content: post.content || "",
              imageUrl: post.imageUrl || "",
            });
          } else {
            setEditingPost(null);
            setNewPost({ title: "", content: "", imageUrl: "" });
          }
          setShowCreateModal(true);
        };

        const savePost = async () => {
          if (!newPost.title?.trim() || !newPost.content?.trim()) {
            alert(t.newsRequired);
            return;
          }

          try {
            const postData = {
              title: newPost.title.trim(),
              content: newPost.content.trim(),
              imageUrl: newPost.imageUrl?.trim() || null,
              authorUid: user?.uid,
              authorName:
                user?.displayName || user?.email?.split("@")[0] || "Admin",
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            };

            if (editingPost) {
              await db.collection("news").doc(editingPost.id).update(postData);
              alert(t.newsUpdated);
            } else {
              await db.collection("news").add({
                ...postData,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              });
              alert(t.newsPublished);
            }

            setNewPost({ title: "", content: "", imageUrl: "" });
            setShowCreateModal(false);
            setEditingPost(null);
          } catch (e) {
            alert(t.errorPrefix + e.message);
          }
        };

        const visiblePosts = newsRoute.postId
          ? posts.filter((post) => post.id === newsRoute.postId)
          : posts;
        const selectedPostMissing =
          !loading && newsRoute.postId && visiblePosts.length === 0;

        return (
          <div className="max-w-4xl mx-auto py-12 md:py-20 px-4 space-y-8 md:space-y-12">
            {newsRoute.postId ? (
              <div className="flex flex-col items-start">
                <button
                  type="button"
                  onClick={() => {
                    window.location.hash = "news";
                    window.scrollTo({ top: 0, behavior: "smooth" });
                  }}
                  className="news-detail-back"
                >
                  <span aria-hidden="true">←</span>
                  {t.backToNews}
                </button>
              </div>
            ) : (
              <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                <div>
                  <h1 className="text-4xl md:text-5xl font-black tracking-tighter">
                    {t.newsSiteTitle}
                  </h1>
                  <p className="opacity-60 mt-2">
                    {t.newsSubtitle}
                    <br />
                    <br />
                  </p>
                  <p className="opacity-60 mt-2">
                    {t.newsModNote}
                    <br />
                    {t.newsRulesNote}{" "}
                  </p>
                </div>

                {isAdmin && (
                  <button
                    onClick={() => openEditor()}
                    className="btn-primary px-8 py-4 rounded-xl text-[11px] uppercase tracking-widest"
                  >
                    +
                  </button>
                )}
              </div>
            )}

            {loading && (
              <div className="text-center py-20">{t.newsLoading}</div>
            )}

            {selectedPostMissing && (
              <div className="glass-card p-10 text-center rounded-3xl">
                <p className="text-xl opacity-70">{t.newsNotFound}</p>
              </div>
            )}

            {!loading && !newsRoute.postId && posts.length === 0 && (
              <div className="glass-card p-20 text-center rounded-3xl">
                <p className="text-xl opacity-60">{t.newsEmpty}</p>
              </div>
            )}

            <div className="space-y-12">
              {visiblePosts.map((post) => (
                <NewsPostCard
                  key={post.id}
                  post={post}
                  user={user}
                  isAdmin={isAdmin}
                  canModerate={canModerate}
                  openEditor={openEditor}
                  targetCommentId={
                    newsRoute.postId === post.id ? newsRoute.commentId : null
                  }
                />
              ))}
            </div>

            {showCreateModal &&
              ReactDOM.createPortal(
                <div
                  className="modal-overlay"
                  onClick={() => setShowCreateModal(false)}
                >
                  <div
                    className="modal-sheet max-w-2xl w-full"
                    onClick={(e) => e.stopPropagation()}
                  >
                    <button
                      className="modal-close"
                      onClick={() => setShowCreateModal(false)}
                    >
                      ×
                    </button>
                    <h3 className="text-3xl font-black mb-8">
                      {editingPost ? t.editPost : t.newPost}
                    </h3>

                    <input
                      type="text"
                      placeholder={t.postTitlePlaceholder}
                      value={newPost.title}
                      onChange={(e) =>
                        setNewPost({ ...newPost, title: e.target.value })
                      }
                      className="w-full text-2xl font-bold mb-6"
                    />
                    <textarea
                      placeholder={t.postContentPlaceholder}
                      value={newPost.content}
                      onChange={(e) =>
                        setNewPost({ ...newPost, content: e.target.value })
                      }
                      className="w-full h-64 p-5 rounded-2xl mb-6"
                    />
                    <input
                      type="url"
                      placeholder={t.postImagePlaceholder}
                      value={newPost.imageUrl}
                      onChange={(e) =>
                        setNewPost({ ...newPost, imageUrl: e.target.value })
                      }
                      className="w-full mb-8"
                    />
                    <button
                      onClick={savePost}
                      className="btn-primary w-full py-4 rounded-xl text-[11px] uppercase tracking-widest"
                    >
                      {editingPost ? t.saveBtn : t.publishBtn}
                    </button>
                  </div>
                </div>,
                document.body,
              )}
          </div>
        );
      };

      const getNewsRoute = () => {
        const [page, postId, section, commentId] = window.location.hash
          .slice(1)
          .split("/");
        return {
          postId: page === "news" ? postId || null : null,
          commentId:
            page === "news" && section === "comment" ? commentId || null : null,
        };
      };

      const createNewsLink = (postId, commentId = null) => {
        const url = new URL(window.location.href);
        url.hash = `news/${postId}${commentId ? `/comment/${commentId}` : ""}`;
        return url.href;
      };

      const copyNewsLink = async (postId, commentId, t) => {
        const link = createNewsLink(postId, commentId);

        try {
          let copied = false;
          if (navigator.clipboard?.writeText) {
            try {
              await navigator.clipboard.writeText(link);
              copied = true;
            } catch (error) {
              if (!document.execCommand) throw error;
            }
          }

          if (!copied) {
            const input = document.createElement("textarea");
            input.value = link;
            input.style.position = "fixed";
            input.style.opacity = "0";
            document.body.appendChild(input);
            input.select();
            try {
              if (!document.execCommand("copy")) {
                throw new Error("The browser could not copy the link.");
              }
            } finally {
              input.remove();
            }
          }

          alert(t.linkCopied);
        } catch (error) {
          console.error("Failed to copy news link:", error);
          alert(t.copyLinkError);
        }
      };

      const NewsPostCard = ({
        post,
        user: propUser,
        isAdmin,
        canModerate,
        openEditor,
        targetCommentId,
      }) => {
        const { t } = useLang();
        const [comments, setComments] = useState([]);
        const [newComment, setNewComment] = useState("");
        const [replyTo, setReplyTo] = useState(null);
        const [showComments, setShowComments] = useState(false);
        const [commentCount, setCommentCount] = useState(0);
        const [postReactions, setPostReactions] = useState({});

        const currentUser = propUser || auth.currentUser;

        useEffect(() => {
          if (targetCommentId) setShowComments(true);
        }, [targetCommentId]);

        useEffect(() => {
          if (
            !targetCommentId ||
            !showComments ||
            !comments.some((comment) => comment.id === targetCommentId)
          ) {
            return;
          }

          requestAnimationFrame(() => {
            document
              .getElementById(`comment-${targetCommentId}`)
              ?.scrollIntoView({ behavior: "smooth", block: "center" });
          });
        }, [comments, showComments, targetCommentId]);

        useEffect(() => {
          const unsub = db
            .collection("news")
            .doc(post.id)
            .onSnapshot((doc) => {
              if (doc.exists) {
                const data = doc.data();
                setPostReactions({
                  likes: data.reactions_likes || [],
                  dislikes: data.reactions_dislikes || [],
                  fire: data.reactions_fire || [],
                  heart: data.reactions_heart || [],
                  wow: data.reactions_wow || [],
                });
              }
            });
          return () => unsub();
        }, [post.id]);

        useEffect(() => {
          const unsub = db
            .collection("news")
            .doc(post.id)
            .collection("comments")
            .orderBy("createdAt", "asc")
            .onSnapshot((snap) => {
              setCommentCount(snap.size);
              if (showComments) {
                setComments(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
              }
            });
          return () => unsub();
        }, [post.id, showComments]);

        const postComment = async () => {
          if (!currentUser) {
            alert(t.loginPlease);
            return;
          }
          if (!newComment.trim()) return;

          try {
            await db
              .collection("news")
              .doc(post.id)
              .collection("comments")
              .add({
                uid: currentUser.uid,
                displayName:
                  currentUser.displayName ||
                  currentUser.email?.split("@")[0] ||
                  "Пользователь",
                avatar: currentUser.photoURL || null,
                text: newComment.trim(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                isAdmin: ADMINS.includes(currentUser.uid),
                replyTo: replyTo ? replyTo.id : null,
                upvotes: [],
                downvotes: [],
              });

            setNewComment("");
            setReplyTo(null);
          } catch (e) {
            console.error(e);
            if (e.code === "permission-denied") {
              alert(t.commentPermissionError);
            } else {
              alert(`${t.commentSendError} ${e.message || e.code || ""}`);
            }
          }
        };

        const commentTree = comments.reduce((acc, comment) => {
          if (!comment.replyTo) {
            acc.push({ ...comment, replies: [] });
          } else {
            const parent = acc.find((c) => c.id === comment.replyTo);
            if (parent) parent.replies.push(comment);
          }
          return acc;
        }, []);

        const handlePostReaction = async (reactionKey) => {
          if (!currentUser) return alert(t.loginToReact);
          const userId = currentUser.uid;
          const postRef = db.collection("news").doc(post.id);
          const field = `reactions_${reactionKey}`;

          await db.runTransaction(async (transaction) => {
            const doc = await transaction.get(postRef);
            if (!doc.exists) return;
            const current = doc.data()[field] || [];
            if (current.includes(userId)) {
              transaction.update(postRef, {
                [field]: firebase.firestore.FieldValue.arrayRemove(userId),
              });
            } else {
              transaction.update(postRef, {
                [field]: firebase.firestore.FieldValue.arrayUnion(userId),
              });
            }
          });
        };

        const handleVote = async (commentId, voteType) => {
          if (!currentUser) return alert(t.loginToVote);

          const userId = currentUser.uid;
          const commentRef = db
            .collection("news")
            .doc(post.id)
            .collection("comments")
            .doc(commentId);

          await db.runTransaction(async (transaction) => {
            const doc = await transaction.get(commentRef);
            if (!doc.exists) return;

            const data = doc.data();
            const upvotes = data.upvotes || [];
            const downvotes = data.downvotes || [];

            if (voteType === "up") {
              if (upvotes.includes(userId)) {
                transaction.update(commentRef, {
                  upvotes: firebase.firestore.FieldValue.arrayRemove(userId),
                });
              } else {
                transaction.update(commentRef, {
                  upvotes: firebase.firestore.FieldValue.arrayUnion(userId),
                  downvotes: firebase.firestore.FieldValue.arrayRemove(userId),
                });
              }
            } else {
              if (downvotes.includes(userId)) {
                transaction.update(commentRef, {
                  downvotes: firebase.firestore.FieldValue.arrayRemove(userId),
                });
              } else {
                transaction.update(commentRef, {
                  downvotes: firebase.firestore.FieldValue.arrayUnion(userId),
                  upvotes: firebase.firestore.FieldValue.arrayRemove(userId),
                });
              }
            }
          });
        };

        const handleDeleteComment = async (comment) => {
          if (!canModerate || !confirm(t.commentDeleteConfirm)) return;

          const commentsRef = db
            .collection("news")
            .doc(post.id)
            .collection("comments");

          try {
            const replies = await commentsRef
              .where("replyTo", "==", comment.id)
              .get();

            for (let start = 0; start < replies.docs.length; start += 500) {
              const batch = db.batch();
              replies.docs
                .slice(start, start + 500)
                .forEach((reply) => batch.delete(reply.ref));
              await batch.commit();
            }

            await commentsRef.doc(comment.id).delete();
          } catch (error) {
            console.error("Failed to delete news comment:", error);
            alert(t.commentDeleteError);
          }
        };

        const uid = currentUser?.uid;

        const POST_REACTIONS = [
          { key: "likes", emoji: "👍" },
          { key: "heart", emoji: "❤️" },
          { key: "fire", emoji: "🔥" },
          { key: "wow", emoji: "😮" },
          { key: "dislikes", emoji: "👎" },
        ];

        const CommentVoteBar = ({ comment }) => {
          const up = comment.upvotes || [];
          const down = comment.downvotes || [];
          const hasUp = uid && up.includes(uid);
          const hasDown = uid && down.includes(uid);
          return (
            <div className="flex items-center gap-3 mt-2 text-xs opacity-60">
              <button
                onClick={() => handleVote(comment.id, "up")}
                className={`reaction-btn flex items-center gap-1 hover:opacity-100 transition ${hasUp ? "liked" : ""}`}
              >
                👍 {up.length > 0 && <span>{up.length}</span>}
              </button>
              <button
                onClick={() => handleVote(comment.id, "down")}
                className={`reaction-btn flex items-center gap-1 hover:opacity-100 transition ${hasDown ? "text-red-400" : ""}`}
              >
                👎 {down.length > 0 && <span>{down.length}</span>}
              </button>
            </div>
          );
        };

        return (
          <div
            id={`news-post-${post.id}`}
            className="glass-card rounded-3xl overflow-hidden scroll-mt-8"
          >
            <div className="p-5 sm:p-8 md:p-10">
              <div className="flex justify-between items-start mb-6">
                <div>
                  <div className="text-xs opacity-40">
                    {post.createdAt?.toDate
                      ? post.createdAt
                          .toDate()
                          .toLocaleDateString(
                            document.documentElement.lang || "ru-RU",
                            {
                              day: "numeric",
                              month: "long",
                              year: "numeric",
                            },
                          )
                      : t.dateRecently}
                  </div>
                  <h2 className="text-2xl md:text-3xl font-black tracking-tighter mt-1">
                    {post.title}
                  </h2>
                </div>

                {isAdmin && openEditor && (
                  <div className="flex gap-4 text-2xl">
                    <button
                      onClick={() => openEditor(post)}
                      className="hover:text-accent transition-colors"
                      title={t.editPost}
                    >
                      📝
                    </button>
                    <button
                      onClick={() =>
                        confirm(t.deleteAction) &&
                        db.collection("news").doc(post.id).delete()
                      }
                      className="hover:text-red-500 transition-colors"
                      title={t.deleteAction}
                    >
                      ❌
                    </button>
                  </div>
                )}
              </div>

              {post.imageUrl && (
                <img
                  src={post.imageUrl}
                  alt=""
                  className="w-full rounded-2xl mb-8"
                />
              )}

              <div
                className="prose dark:prose-invert max-w-none text-sm leading-relaxed"
                dangerouslySetInnerHTML={{ __html: formatText(post.content) }}
              />

              <div className="mt-6 flex flex-wrap gap-2">
                {POST_REACTIONS.map(({ key, emoji }) => {
                  const arr = postReactions[key] || [];
                  const active = uid && arr.includes(uid);
                  return (
                    <button
                      key={key}
                      onClick={() => handlePostReaction(key)}
                      className={`reaction-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm border transition-all
                        ${
                          active
                            ? "border-[var(--accent)] bg-[var(--accent)]/10 text-[var(--accent)]"
                            : "border-[var(--border)] hover:border-[var(--accent)] opacity-60 hover:opacity-100"
                        }`}
                    >
                      <span>{emoji}</span>
                      {arr.length > 0 && (
                        <span className="text-xs font-bold">{arr.length}</span>
                      )}
                    </button>
                  );
                })}
              </div>

              <div className="news-post-actions">
                <button
                  type="button"
                  onClick={() => copyNewsLink(post.id, null, t)}
                  className="news-action-button news-action-share"
                >
                  <span aria-hidden="true">↗</span>
                  {t.shareNews}
                </button>

                <button
                  type="button"
                  onClick={() => setShowComments(!showComments)}
                  className="news-action-button news-action-comments"
                >
                  {t.commentsLabel} ({commentCount})
                </button>
              </div>
            </div>

            {showComments && (
              <div className="border-t border-[var(--border)] p-4 sm:p-6 md:p-8 bg-[var(--card-bg)] rounded-b-3xl">
                {currentUser ? (
                  <div className="mb-8">
                    <textarea
                      value={newComment}
                      onChange={(e) => setNewComment(e.target.value)}
                      placeholder={
                        replyTo
                          ? t.replyPlaceholder.replace(
                              "{name}",
                              replyTo.displayName,
                            )
                          : t.commentPlaceholder
                      }
                      className="w-full h-28 p-5 rounded-2xl border border-[var(--border)] focus:border-[var(--accent)] bg-[var(--card-bg)]"
                    />
                    <div className="flex justify-end gap-3 mt-4">

        const { t } = useLang();
        const [isUploading, setIsUploading] = useState(false);
        const [avatar, setAvatar] = useState(user?.photoURL || "");
        const [moderationCount, setModerationCount] = useState(0);
        const [showModal, setShowModal] = useState(null);
        const [pendingPamyatki, setPendingPamyatki] = useState([]);
        const [isTechSupport, setIsTechSupport] = useState(false);

        const [vkOverride, setVkOverride] = useState("");
        const [hinataOverride, setHinataOverride] = useState("");
        const [isAdmin, setIsAdmin] = useState(false);

        useEffect(() => {
          if (!user?.uid) return;

          setIsAdmin(ADMINS.includes(user.uid));
          setIsTechSupport(false);
          const userRef = db.collection("users").doc(user.uid);

          userRef
            .get()
            .then((doc) => {
              if (doc.exists) {
                const data = doc.data();
                setIsAdmin(ADMINS.includes(user.uid));
                setIsTechSupport(data.role === "tech_support");
              }
            })
            .catch((err) => {
              console.error("Ошибка чтения роли:", err);
            });
        }, [user?.uid]);

        const fileInput = useRef();

        useEffect(() => {
          if (!ADMINS.includes(user.uid) && !isTechSupport) {
            setModerationCount(0);
            setPendingPamyatki([]);
            return undefined;
          }

          const unsub = db
            .collection("pamyatki")
            .where("status", "==", "pending")
            .onSnapshot((snap) => {
              setModerationCount(snap.size);
              setPendingPamyatki(
                snap.docs.map((doc) => ({ id: doc.id, ...doc.data() })),
              );
            });
          return () => unsub();
        }, [user.uid, isTechSupport]);

        useEffect(() => {
          if (ADMINS.includes(user.uid)) {
            db.collection("settings")
              .doc("video_overrides")
              .get()
              .then((doc) => {
                if (doc.exists) {
                  const data = doc.data();
                  setYtOverride(data.yt_override || "");
                  setVkOverride(data.vk_override || "");
                  setHinataOverride(data.hinata_override || "");
                }
              })
              .catch(console.error);

        const saveVideoOverrides = async () => {
          if (!ADMINS.includes(user.uid)) return;

          try {
            await db
              .collection("settings")
              .doc("video_overrides")
              .set(
                {
                  yt_override: ytOverride.trim() || null,
                  vk_override: vkOverride.trim() || null,
                  hinata_override: hinataOverride.trim() || null,
                  updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                  updatedBy: user.uid,
                },
                { merge: true },
              );

            alert(t.overridesSaved);
          } catch (err) {
            alert(t.errorPrefix + err.message);
          }
        };

        const uploadAvatar = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          setIsUploading(true);
          try {
            const formData = new FormData();
            formData.append("image", file);
            const res = await fetch(
              `https://api.imgbb.com/1/upload?key=fac7e04a7bdbc05013b7483b33eae743`,
              {
                method: "POST",
                body: formData,
              },
            );
            const data = await res.json();
            const url = data.data.url;
            await user.updateProfile({ photoURL: url });
            setAvatar(url);
            alert(t.avatarUpdated);
          } catch (err) {
            console.error(err);
            alert(t.uploadError);
          } finally {
            setIsUploading(false);
          }
        };

        const submitPamyatka = async (e) => {
          e.preventDefault();

          const title = e.target.p_title.value.trim();
          const imageUrl = e.target.p_url.value.trim();
          const tableUrl = e.target.p_table_url.value.trim() || null;

          if (!title || !imageUrl) {
            alert(t.memoRequired);
            return;
          }

          try {
            await db.collection("pamyatki").add({
              uid: user.uid,
              displayName: user.displayName || user.email?.split("@")[0] || "",
              email: user.email,
              title: title,
              imageUrl: imageUrl,
              tableUrl: tableUrl,
              status: "pending",
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });

            alert(t.memoSubmitted);
            setShowModal(null);
            e.target.reset();
          } catch (err) {
            console.error(err);
            alert(t.errorPrefix + err.message);
          }
        };

        const handleMod = async (id, status) => {
          if (status === "approved") {
            await db
              .collection("pamyatki")
              .doc(id)
              .update({ status: "approved" });
            alert(t.memoAccepted);
          } else {
            if (confirm(t.memoDeleteConfirm)) {
              await db.collection("pamyatki").doc(id).delete();
              alert(t.memoDeleted);
            }
          }
        };

        const changeNickname = async (e) => {
          e.preventDefault();
          const newName = e.target.new_nickname.value.trim();
          if (!newName) return alert(t.nicknameRequired);
          try {
            await user.updateProfile({ displayName: newName });
            alert(t.nicknameUpdated);
            window.location.reload();
          } catch (e) {
            alert(e.message);
          }
        };

        const changeEmail = async (e) => {
          e.preventDefault();
          const newEmail = e.target.new_email.value.trim().toLowerCase();
          const password = e.target.current_password_email.value;
          if (!newEmail || !password) return alert(t.fieldsRequired);
          try {
            const credential = firebase.auth.EmailAuthProvider.credential(
              user.email,
              password,
            );
            await user.reauthenticateWithCredential(credential);
            await user.verifyBeforeUpdateEmail(newEmail);
            alert(t.emailVerificationSent);
          } catch (e) {
            alert(e.message);
          }
        };

        const changePassword = async (e) => {
          e.preventDefault();
          const cur = e.target.current_password.value;
          const np = e.target.new_password.value;
          const npc = e.target.new_password_confirm.value;
          if (np !== npc) return alert(t.passwordMismatch);
          if (np.length < 6) return alert(t.passwordMinLength);
          try {
            const cred = firebase.auth.EmailAuthProvider.credential(
              user.email,
              cur,
            );
            await user.reauthenticateWithCredential(cred);
            await user.updatePassword(np);
            alert(t.passwordUpdated);
            e.target.reset();
          } catch (e) {
            alert(e.message);
          }
        };

        const deleteAccount = async (e) => {
          e.preventDefault();
          const password = e.target.del_password.value;
          if (!password) return alert(t.currentPasswordRequired);
          if (!confirm(t.accountDeleteConfirm)) return;
          try {
            const credential = firebase.auth.EmailAuthProvider.credential(
              user.email,
              password,
            );
            await user.reauthenticateWithCredential(credential);

            const profileRef = db.collection("users").doc(user.uid);
            const profileSnapshot = await profileRef.get();
            if (profileSnapshot.exists) await profileRef.delete();

            try {
              await user.delete();
            } catch (deleteError) {
              if (profileSnapshot.exists) {
                const profile = profileSnapshot.data();
                try {
                  await profileRef.set({
                    email: profile.email || user.email || "",
                    displayName:
                      profile.displayName || user.displayName || null,
                    footerSocials: profile.footerSocials || "SUIVEZ-NOUS",
                    createdAt:
                      profile.createdAt ||
                      firebase.firestore.FieldValue.serverTimestamp(),
                  });
                } catch (restoreError) {
                  console.error(
                    "Failed to restore account profile after deletion error:",
                    restoreError,
                  );
                  throw new Error(
                    `${deleteError.message} ${t.profileRestoreError}`,
                  );
                }
              }
              throw deleteError;
            }

            alert(t.accountDeleted);
            navigate("home");

            alert(t.accountDeleteErrorPrefix + err.message);

                        <path d="m9 12 2 2 4-4" />
                      </svg>

      const HeroTitle = () => {
        const { t } = useLang();
        const HERO_TEXTS_LOCAL = t.heroTexts || HERO_TEXTS;
        const {
          useState: useStateH,
          useEffect: useEffectH,
          useRef: useRefH,
        } = React;
        const [idx, setIdx] = React.useState(0);
        const [phase, setPhase] = React.useState("in");
        const timerRef = React.useRef(null);

        React.useEffect(() => {
          setIdx(0);
          setPhase("in");
        }, [t]);

        React.useEffect(() => {
          const cycle = () => {
            timerRef.current = setTimeout(() => {
              setPhase("out");
              timerRef.current = setTimeout(() => {
                setIdx((prev) => (prev + 1) % HERO_TEXTS_LOCAL.length);
                setPhase("in");
                cycle();
              }, 350);
            }, 4200);
          };

          cycle();
          return () => clearTimeout(timerRef.current);
        }, [HERO_TEXTS_LOCAL]);

        const lines = HERO_TEXTS_LOCAL[idx] || [];

        return (
          <h1 className="hero-title font-black tracking-[-0.03em] leading-[0.85] text-[2.65rem] xs:text-[3.1rem] sm:text-[3.9rem] md:text-[5.2rem] lg:text-[6.0rem] xl:text-[6.7rem]">
            {lines.map((line, i) => (
              <span key={idx + "-" + i} style={{ display: "block" }}>
                <span
                  className={"hero-text-flip" + (phase === "out" ? " out" : "")}
                  style={{
                    animationDelay:
                      phase === "in" ? i * 0.08 + "s" : i * 0.05 + "s",
                  }}
                >
                  {line}
                </span>
              </span>
            ))}
          </h1>
        );
      };

      const NavPill = ({ currentPage, navigate, t }) => {
        const pillRef = useRef(null);
        const indicatorRef = useRef(null);

        const updateIndicator = () => {
          if (!pillRef.current || !indicatorRef.current) return;
          const activeBtn = pillRef.current.querySelector(".nav-link.active");
          if (!activeBtn) {
            indicatorRef.current.style.width = "0px";
            return;
          }
          const pillRect = pillRef.current.getBoundingClientRect();
          const btnRect = activeBtn.getBoundingClientRect();
          indicatorRef.current.style.left = btnRect.left - pillRect.left + "px";
          indicatorRef.current.style.width = btnRect.width + "px";
        };

        useEffect(() => {
          const raf = requestAnimationFrame(updateIndicator);
          return () => cancelAnimationFrame(raf);
        }, [currentPage]);

        return (
          <div
            ref={pillRef}
            className="nav-pill text-[10px] font-medium uppercase"
          >
            <div ref={indicatorRef} className="nav-pill-indicator" />
            {NAV_ITEMS.map(({ key, labelKey }) => (
              <button
                key={key}
                onClick={() => navigate(key)}
                className={`nav-link ${currentPage === key ? "active" : ""}`}

      const Notifications = ({ user }) => {
        const { lang, t } = useLang();
        const [notifications, setNotifications] = useState([]);
        const [showNotif, setShowNotif] = useState(false);
        const [lastReadTimestamp, setLastReadTimestamp] = useState(null);
        const isAdmin = user && ADMINS.includes(user.uid);
        const panelRef = useRef(null);

        useEffect(() => {
          if (!user) return;

          const unsub = db
            .collection("notifications")
            .orderBy("createdAt", "desc")
            .limit(30)
            .onSnapshot(
              (snap) => {
                const data = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                setNotifications(data);
              },
              (err) => console.error("Notifications error:", err),
            );

          db.collection("users")
            .doc(user.uid)
            .get()
            .then((doc) => {
              if (doc.exists && doc.data().lastReadNotifications) {
                setLastReadTimestamp(doc.data().lastReadNotifications);
              }
            });

          return () => unsub();
        }, [user]);

        useEffect(() => {
          const handleClickOutside = (e) => {
            if (panelRef.current && !panelRef.current.contains(e.target)) {
              setShowNotif(false);
            }
          };
          document.addEventListener("mousedown", handleClickOutside);
          return () =>
            document.removeEventListener("mousedown", handleClickOutside);
        }, []);

        const openNotifications = () => {
          const newState = !showNotif;
          setShowNotif(newState);

          if (newState && user) {
            const now = firebase.firestore.FieldValue.serverTimestamp();
            db.collection("users")
              .doc(user.uid)
              .set(
                {
                  lastReadNotifications: now,
                },
                { merge: true },
              )
              .then(() => {
                setLastReadTimestamp(now);
              });
          }
        };

        const unreadCount = React.useMemo(() => {
          if (!lastReadTimestamp) return notifications.length;

          return notifications.filter((n) => {
            if (!n.createdAt) return true;
            const notificationTime = n.createdAt.toDate
              ? n.createdAt.toDate()
              : new Date(n.createdAt);
            const lastReadTime = lastReadTimestamp.toDate
              ? lastReadTimestamp.toDate()
              : new Date(lastReadTimestamp);
            return notificationTime > lastReadTime;
          }).length;
        }, [notifications, lastReadTimestamp]);

        const sendNotification = async () => {
          if (!isAdmin) return;
          const text = prompt(t.notifPrompt);
          if (!text || !text.trim()) return;

          try {
            await db.collection("notifications").add({
              text: text.trim(),
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              author: user.displayName || user.email || "Админ",
            });
            alert(t.notifSent);
          } catch (e) {
            alert(t.errorPrefix + e.message);
          }
        };

        const formatNotifText = (text) => {
          if (!text) return "";
          return text.replace(
            /(https?:\/\/[^\s]+)/g,
            '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline">$1</a>',
          );
        };

        return (

            <button

              </svg>

              {unreadCount > 0 && (
                <div className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-[10px] rounded-full flex items-center justify-center text-white font-bold">
                  {unreadCount > 9 ? "9+" : unreadCount}
                </div>
              )}
            </button>

            {showNotif &&
              ReactDOM.createPortal(
                <div
                  className="modal-overlay notif-overlay"
                  onClick={(e) => {
                    if (e.target === e.currentTarget) setShowNotif(false);
                  }}
                >
                  <div
                    ref={panelRef}

                  >
                    <div className="notif-handle" />

                    <div className="notif-header">
                      <div className="flex items-center gap-3">

                            <p className="text-[10px] opacity-40 uppercase tracking-widest mt-0.5">
                              {notifications.length}{" "}
                              {t[
                                `notifCount${new Intl.PluralRules(lang)

                                  .replace(/^./, (letter) =>
                                    letter.toUpperCase(),
                                  )}`
                              ] || t.notifCountOther}
                            </p>
                          )}
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        {isAdmin && (
                          <button
                            onClick={sendNotification}

                            {t.notifSend}
                          </button>
                        )}

                                    dangerouslySetInnerHTML={{

                                  />
                                  <p className="text-[10px] opacity-40 mt-2 uppercase tracking-wider">
                                    {n.createdAt?.toDate
                                      ? n.createdAt
                                          .toDate()
                                          .toLocaleString("ru-RU")
                                      : ""}
                                  </p>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

      const LangSwitcher = ({ lang, setLang }) => {
        const [open, setOpen] = React.useState(false);
        const ref = React.useRef(null);
        const current = LANGUAGES.find((l) => l.code === lang) || LANGUAGES[0];

        React.useEffect(() => {
          const handleClickOutside = (e) => {
            if (ref.current && !ref.current.contains(e.target)) setOpen(false);
          };
          document.addEventListener("mousedown", handleClickOutside);
          return () =>
            document.removeEventListener("mousedown", handleClickOutside);
        }, []);

        const handleSelect = (code) => {
          setLang(code);
          localStorage.setItem("bipbup-lang", code);
          document.documentElement.lang = code;
          setOpen(false);
        };

        return (
          <div ref={ref} className={`lang-switcher${open ? " open" : ""}`}>
            <button
              className={`lang-btn${open ? " open" : ""}`}
              onClick={() => setOpen((o) => !o)}
              aria-label="Выбор языка"
            >
              <span>{current.flag}</span>
              <span>{current.code.toUpperCase()}</span>
              <i className="lang-arrow">▼</i>
            </button>
            <div className="lang-dropdown">
              {LANGUAGES.map((l) => (
                <button
                  key={l.code}
                  className={`lang-option${lang === l.code ? " active" : ""}`}
                  onClick={() => handleSelect(l.code)}
                >
                  <span className="lang-flag">{l.flag}</span>
                  <span>{l.label}</span>
                </button>
              ))}
            </div>
          </div>
        );
      };
