    <script>
      let themeInitialized = false;

      function initTheme() {
        if (themeInitialized) return;
        themeInitialized = true;

        const savedTheme = localStorage.getItem("bipbup-theme");
        const isFirstVisit = !localStorage.getItem("bipbup-visited");

        if (isFirstVisit) {
          localStorage.setItem("bipbup-visited", "true");
          document.documentElement.setAttribute("data-theme", "light");
        } else if (savedTheme) {
          document.documentElement.setAttribute("data-theme", savedTheme);
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
        updateThemeIcon();
      }

      function toggleTheme() {
        const current =
          document.documentElement.getAttribute("data-theme") || "light";
        const newTheme = current === "dark" ? "light" : "dark";

        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("bipbup-theme", newTheme);
        updateThemeIcon();
      }

      function updateThemeIcon() {
        const icon = document.getElementById("theme-icon");
        if (!icon) return;

        const isDark =
          document.documentElement.getAttribute("data-theme") === "dark";
        icon.innerHTML = isDark
          ? '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>'
          : '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path><path d="M16 8v2"></path><path d="M17 9h-2"></path></svg>';
      }

      window.addEventListener("load", () => {
        initTheme();

        setTimeout(() => {
          const btn = document.getElementById("theme-toggle");
          if (btn) {
            btn.addEventListener("click", toggleTheme);
          }
        }, 300);
      });
    </script>
    <script>
      function initYandexMetrika() {
        (function (m, e, t, r, i, k, a) {
          m[i] =
            m[i] ||
            function () {
              (m[i].a = m[i].a || []).push(arguments);
            };
          m[i].l = 1 * new Date();
          for (var j = 0; j < document.scripts.length; j++) {
            if (document.scripts[j].src === r) {
              return;
            }
          }
          ((k = e.createElement(t)),
            (a = e.getElementsByTagName(t)[0]),
            (k.async = 1),
            (k.src = r),
            a.parentNode.insertBefore(k, a));
        })(
          window,
          document,
          "script",
          "https://mc.yandex.ru/metrika/tag.js",
          "ym",
        );

        ym(99936739, "init", {
          clickmap: true,
          trackLinks: true,
          accurateTrackBounce: true,
          webvisor: true,
        });
      }

      function hasCookieConsent() {
        return localStorage.getItem("cookieConsent") === "accepted";
      }

      let yandexMetrikaScheduled = false;

      function scheduleYandexMetrika() {
        if (yandexMetrikaScheduled) return;
        yandexMetrikaScheduled = true;

        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(initYandexMetrika, { timeout: 5000 });
        } else {
          window.setTimeout(initYandexMetrika, 1500);
        }
      }

      function showCookieBanner() {
        const banner = document.getElementById("cookie-banner");
        if (banner && !hasCookieConsent()) {
          setTimeout(() => banner.classList.add("show"), 800);
        }
      }

      function acceptCookies() {
        localStorage.setItem("cookieConsent", "accepted");
        document.getElementById("cookie-banner").classList.remove("show");
        scheduleYandexMetrika();
      }

      function rejectCookies() {
        localStorage.setItem("cookieConsent", "rejected");
        document.getElementById("cookie-banner").classList.remove("show");
      }

      document.addEventListener("DOMContentLoaded", () => {
        showCookieBanner();

        if (hasCookieConsent()) {
          scheduleYandexMetrika();
        }

        document
          .getElementById("cookie-accept")
          ?.addEventListener("click", acceptCookies);
        document
          .getElementById("cookie-reject")
          ?.addEventListener("click", rejectCookies);
      });
    </script>
