      const PasswordGenerator = () => {
        const [length, setLength] = useState(16);
        const [upper, setUpper] = useState(true);
        const [lower, setLower] = useState(true);
        const [numbers, setNumbers] = useState(true);
        const [symbols, setSymbols] = useState(true);
        const [password, setPassword] = useState('');

        const generate = () => {
          let chars = '';
          if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
          if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
          if (numbers) chars += '0123456789';
          if (symbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

          if (chars === '') {
            alert('Выберите хотя бы один тип символов');
            return;
          }

          let pw = '';
          for (let i = 0; i < length; i++) {
            pw += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          setPassword(pw);
        };

        const copy = () => {
          if (password) {
            navigator.clipboard.writeText(password);
            alert('Пароль скопирован!');
          }
        };

        return (
          <div className="text-center space-y-8 animate-in fade-in duration-300">
            <h3 className="text-2xl font-black tracking-tighter">

                </label>
                <input
                  type="number"
                  min="8"
                  max="64"
                  value={length}
                  onChange={(e) =>
                    setLength(
                      Math.max(8, Math.min(64, parseInt(e.target.value) || 8))
                    )
                  }
                  className="text-xl font-bold"
                />
              </div>
              <div className="grid grid-cols-2 gap-4 text-sm">

                  A-Z

                <label className="flex items-center gap-3">
                  <input
                    type="checkbox"
                    checked={lower}
                    onChange={(e) => setLower(e.target.checked)}
                    className="w-5 h-5"
                  />{' '}
                  a-z
                </label>
                <label className="flex items-center gap-3">
                  <input
                    type="checkbox"
                    checked={numbers}
                    onChange={(e) => setNumbers(e.target.checked)}
                    className="w-5 h-5"
                  />{' '}
                  0-9
                </label>
                <label className="flex items-center gap-3">
                  <input
                    type="checkbox"
                    checked={symbols}
                    onChange={(e) => setSymbols(e.target.checked)}
                    className="w-5 h-5"
                  />{' '}
                  !@#...
                </label>
              </div>
              <button
                onClick={generate}
                className="btn-primary w-full py-5 rounded-2xl text-xs uppercase tracking-[0.3em] font-black"
              >
                Сгенерировать
              </button>
              <div onClick={copy} className="cursor-pointer group py-8">
                <div className="text-2xl md:text-3xl font-bold break-all text-transparent bg-clip-text bg-gradient-to-r from-white to-[#000000] group-hover:scale-105 transition-transform">

                  </p>
                )}
              </div>
            </div>
          </div>
        );
      };

      const LevelCalculator = () => {
        const [currentLevel, setCurrentLevel] = useState(1);
        const [expPerPayday, setExpPerPayday] = useState(1);
        const [hasX2, setHasX2] = useState(false);
        const [paydaysToNext, setPaydaysToNext] = useState(0);
        const [expNeeded, setExpNeeded] = useState(0);

        useEffect(() => {
          const baseExpToNext = currentLevel * 2;
          const multiplier = hasX2 ? 2 : 1;
          const effectiveExp = expPerPayday * multiplier;

          const needed = Math.max(0, baseExpToNext);
          const paydays =
            effectiveExp > 0 ? Math.ceil(needed / effectiveExp) : 0;

          setExpNeeded(needed);
          setPaydaysToNext(paydays);
        }, [currentLevel, expPerPayday, hasX2]);

        return (

        const { useState, useEffect, useRef } = React;
        const [idx, setIdx] = React.useState(0);
        const [phase, setPhase] = React.useState('in'); // 'in' | 'out'
        const timerRef = React.useRef(null);

        React.useEffect(() => {
          // Показываем первый текст 4 секунды, потом переключаем
          timerRef.current = setTimeout(function cycle() {
            // Фаза выхода
            setPhase('out');
            setTimeout(() => {
              setIdx((prev) => (prev + 1) % HERO_TEXTS.length);
              setPhase('in');
              // Следующий цикл через 4 секунды
              timerRef.current = setTimeout(cycle, 4000);
            }, 450);
          }, 4000);
          return () => clearTimeout(timerRef.current);
        }, []);

        const lines = HERO_TEXTS[idx];

        return (
          <h1 className="font-black tracking-[-0.03em] leading-[0.85] text-[2.65rem] xs:text-[3.1rem] sm:text-[3.9rem] md:text-[5.2rem] lg:text-[6.0rem] xl:text-[6.7rem]">
            {lines.map((line, i) => (
              <span key={idx + '-' + i} style={{ display: 'block' }}>
                <span
                  className={'hero-text-flip' + (phase === 'out' ? ' out' : '')}
                  style={{
                    animationDelay:
                      phase === 'in' ? i * 0.08 + 's' : i * 0.05 + 's',
                  }}
                >
                  {line}
                </span>
              </span>
            ))}
          </h1>
        );

          return hash;

          if (page === currentPage) return;

          setIsTransitioning(true);

          setTimeout(() => {
            window.scrollTo({ top: 0, behavior: 'instant' });
            window.location.hash = page;
            setCurrentPage(page);
            localStorage.setItem('bipbup_last_page', page);
            setIsMenuOpen(false);

            setTimeout(() => setIsTransitioning(false), 300);
          }, 180);
        };

          const handleHashChange = () => {
            const page = getPageFromHash();

              setTimeout(() => {
                setCurrentPage(page);
                setTimeout(() => setIsTransitioning(false), 300);
              }, 180);
            }

          window.addEventListener('hashchange', handleHashChange);
          return () =>
            window.removeEventListener('hashchange', handleHashChange);

            }

          return () => unsubscribe();

    <script>
      let themeInitialized = false;

      function initTheme() {
        if (themeInitialized) return;
        themeInitialized = true;

        const savedTheme = localStorage.getItem('bipbup-theme');
        const isFirstVisit = !localStorage.getItem('bipbup-visited');

        if (isFirstVisit) {
          localStorage.setItem('bipbup-visited', 'true');
          document.documentElement.setAttribute('data-theme', 'light');
        } else if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        updateThemeIcon();
      }

      function toggleTheme() {
        const current =
          document.documentElement.getAttribute('data-theme') || 'light';
        const newTheme = current === 'dark' ? 'light' : 'dark';

        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('bipbup-theme', newTheme);
        updateThemeIcon();
      }

      function updateThemeIcon() {
        const icon = document.getElementById('theme-icon');
        if (!icon) return;
        const isDark =
          document.documentElement.getAttribute('data-theme') === 'dark';
      }

      window.addEventListener('load', () => {
        initTheme();

        setTimeout(() => {
          const btn = document.getElementById('theme-toggle');
          if (btn) {
            btn.addEventListener('click', toggleTheme);
          }
        }, 300);
      });
    </script>
